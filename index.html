<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>货车装箱 - 多次随机贪心</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:system-ui, sans-serif; background:#1a1a2e; color:#eee; }
    .container { display:flex; height:100vh; }
    .panel { width:380px; background:#16213e; padding:20px; overflow-y:auto; }
    h2 { margin-bottom:15px; color:#e94560; }
    label { display:block; margin:10px 0 4px; font-size:14px; }
    input, button, select { width:100%; padding:8px; border:none; border-radius:6px; margin-bottom:8px; }
    input, select { background:#0f3460; color:#fff; }
    button { background:#e94560; color:white; font-weight:bold; cursor:pointer; }
    button:hover { background:#ff6b81; }
    .box-row { display:flex; gap:5px; align-items:center; flex-wrap:wrap; }
    .box-row input { width:65px; }
    .box-row button { width:auto; padding:6px 10px; font-size:12px; }
    #addBoxBtn { margin-top:10px; }
    .result { margin-top:15px; white-space:pre-wrap; font-size:13px; max-height:300px; overflow-y:auto; }
    #viewer { flex:1; position:relative; }
    canvas { display:block; }
  </style>
</head>
<body>
<div class="container">
  <div class="panel">
    <h2>📦 货车装箱参数</h2>
    <label>宽 (左右, cm)</label><input id="tw" type="number" value="235">
    <label>深 (前后, cm)</label><input id="td" type="number" value="589">
    <label>高 (上下, cm)</label><input id="th" type="number" value="239">
    <h3>纸箱</h3>
    <div id="boxList"></div>
    <button id="addBoxBtn">➕ 添加纸箱</button>
    <div style="margin-top:15px;">
      <label>算法</label>
      <select id="mode">
        <option value="multi" selected>多次随机贪心 (推荐)</option>
        <option value="single">单次贪心</option>
      </select>
    </div>
    <button id="calcBtn">🚛 开始计算</button>
    <div id="resultText" class="result"></div>
  </div>
  <div id="viewer"></div>
</div>

<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- 方向 ----------
function getAllowedOrientations(w,d,h, topLayer) {
  const ori = [[w,d,h]];
  if (w !== d) ori.push([d,w,h]);
  if (topLayer) {
    const all = [[w,d,h],[d,w,h],[w,h,d],[h,w,d],[d,h,w],[h,d,w]];
    return Array.from(new Set(all.map(a=>a.join(',')))).map(s=>s.split(',').map(Number));
  }
  return ori;
}

// ---------- 空间管理器（优化切割 + 合并）----------
class SpaceManager {
  constructor(tw, td, th) {
    this.spaces = [{ x:0, y:0, z:0, w:tw, d:td, h:th, isFloor:true }];
    this.tw = tw; this.td = td; this.th = th;
  }

  mergeSpaces() {
    let merged = true;
    while (merged) {
      merged = false;
      for (let i = 0; i < this.spaces.length; i++) {
        const a = this.spaces[i];
        for (let j = i+1; j < this.spaces.length; j++) {
          const b = this.spaces[j];
          if (a.isFloor !== b.isFloor) continue;
          // 上下合并 (x,z,w,d相同)
          if (a.x===b.x && a.z===b.z && a.w===b.w && a.d===b.d) {
            if (a.y+a.h===b.y) { a.h+=b.h; this.spaces.splice(j,1); merged=true; break; }
            if (b.y+b.h===a.y) { a.y=b.y; a.h+=b.h; this.spaces.splice(j,1); merged=true; break; }
          }
          // 前后合并 (x,y,w,h相同)
          if (a.x===b.x && a.y===b.y && a.w===b.w && a.h===b.h) {
            if (a.z+a.d===b.z) { a.d+=b.d; this.spaces.splice(j,1); merged=true; break; }
            if (b.z+b.d===a.z) { a.z=b.z; a.d+=b.d; this.spaces.splice(j,1); merged=true; break; }
          }
          // 左右合并 (y,z,d,h相同)
          if (a.y===b.y && a.z===b.z && a.d===b.d && a.h===b.h) {
            if (a.x+a.w===b.x) { a.w+=b.w; this.spaces.splice(j,1); merged=true; break; }
            if (b.x+b.w===a.x) { a.x=b.x; a.w+=b.w; this.spaces.splice(j,1); merged=true; break; }
          }
        }
        if (merged) break;
      }
    }
  }

  isTopSpace(space) {
    return Math.abs(space.y + space.h - this.th) < 0.01;
  }

  queryAllPlacements(originalW, originalD, originalH) {
    this.mergeSpaces();
    const candidates = [];
    for (let i = 0; i < this.spaces.length; i++) {
      const s = this.spaces[i];
      if (s.isFloor && s.y > 0) continue; // 悬空地板不允许
      const topLayer = this.isTopSpace(s);
      const orientations = getAllowedOrientations(originalW, originalD, originalH, topLayer);
      for (let [ow, od, oh] of orientations) {
        if (ow <= s.w && od <= s.d && oh <= s.h) {
          // 计算放置后剩余空间的最小维度（模拟切割）
          const rem = [];
          if (s.w - ow > 0) rem.push({ w: s.w-ow, d: s.d, h: s.h });
          if (s.h - oh > 0) rem.push({ w: s.w, d: s.d, h: s.h-oh }); // ★上方全宽
          if (s.d - od > 0) rem.push({ w: ow, d: s.d-od, h: s.h }); // ★前方全高
          let minDim = rem.length ? Math.min(...rem.map(r => Math.min(r.w, r.d, r.h))) : 0;

          let contact = 0;
          if (s.z === 0) contact += ow * oh;
          if (s.y === 0 && s.isFloor) contact += ow * od;
          if (s.x === 0) contact += od * oh;
          if (!s.isFloor) contact += ow * od;

          candidates.push({ spaceIdx: i, bw:ow, bd:od, bh:oh, minDim, contact, volume: ow*od*oh });
        }
      }
    }
    return candidates;
  }

  applyPlace(spaceIdx, bw, bd, bh) {
    const s = this.spaces[spaceIdx];
    const pos = { x: s.x, y: s.y, z: s.z };
    const newSpaces = [];
    // 右侧 (全深全高)
    if (s.w - bw > 0) newSpaces.push({ x: s.x+bw, y: s.y, z: s.z, w: s.w-bw, d: s.d, h: s.h, isFloor: s.isFloor });
    // 上方 (全宽全深)
    if (s.h - bh > 0) newSpaces.push({ x: s.x, y: s.y+bh, z: s.z, w: s.w, d: s.d, h: s.h-bh, isFloor: false });
    // 前方 (宽高同箱子)
    if (s.d - bd > 0) newSpaces.push({ x: s.x, y: s.y, z: s.z+bd, w: bw, d: s.d-bd, h: s.h, isFloor: s.isFloor });

    this.spaces.splice(spaceIdx, 1);
    this.spaces.push(...newSpaces);
    this.mergeSpaces();
    return pos;
  }
}

// ---------- 单次贪心放置 ----------
function runGreedy(tw, td, th, items) {
  const sm = new SpaceManager(tw, td, th);
  const placed = [];
  const steps = [];
  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    const cands = sm.queryAllPlacements(item.w, item.d, item.h);
    if (cands.length === 0) return { success: false, placed: [] };

    // 评分：体积(0.01)+接触(0.3)+最小维度(1.0)
    let best = cands[0];
    let bestScore = -Infinity;
    for (let c of cands) {
      const score = c.volume*0.01 + c.contact*0.3 + c.minDim*1.0;
      if (score > bestScore) { bestScore = score; best = c; }
    }
    const pos = sm.applyPlace(best.spaceIdx, best.bw, best.bd, best.bh);
    placed.push({ name: item.name, x:pos.x, y:pos.y, z:pos.z, w:best.bw, d:best.bd, h:best.bh });
    steps.push(`${item.name} 于 (${pos.x},${pos.y},${pos.z}) ${best.bw}×${best.bd}×${best.bh}${best.bh!==item.h?'(侧放)':''}`);
  }
  return { success: true, placed, steps };
}

// ---------- 多次随机贪心 ----------
function multiRandomPack(tw, td, th, boxes, maxTrials = 50) {
  // 展开所有箱子
  const baseItems = [];
  for (let box of boxes) {
    for (let i = 0; i < box.count; i++) {
      baseItems.push({ name: box.name, w: box.w, d: box.d, h: box.h });
    }
  }
  // 按体积降序作为基础顺序
  baseItems.sort((a,b) => (b.w*b.d*b.h) - (a.w*a.d*a.h));

  let bestResult = null;
  let bestPlaced = 0;

  for (let trial = 0; trial < maxTrials; trial++) {
    // 打乱同体积的箱子顺序（但保持大致降序）
    const items = [...baseItems];
    // 随机洗牌 (Fisher–Yates)
    for (let i = items.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [items[i], items[j]] = [items[j], items[i]];
    }
    const result = runGreedy(tw, td, th, items);
    if (result.success) {
      return result; // 成功装入所有箱子，立即返回
    }
    if (result.placed.length > bestPlaced) {
      bestPlaced = result.placed.length;
      bestResult = result;
    }
  }
  return bestResult; // 返回装入最多箱子的结果
}

// ---------- 截面验证 ----------
function verifySlices(placed, tw, th, step = 10) {
  const maxZ = Math.max(...placed.map(p => p.z + p.d));
  for (let z = 0; z <= maxZ; z += step) {
    let totalArea = 0;
    for (let p of placed) {
      if (p.z <= z && p.z + p.d > z) {
        totalArea += p.w * p.h;
      }
    }
    if (totalArea > tw * th + 0.01) {
      return { valid: false, z, totalArea, maxArea: tw * th };
    }
  }
  return { valid: true };
}

// ---------- 3D 渲染 ----------
let scene, camera, renderer, controls;
function init3D() {
  const container = document.getElementById('viewer');
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x1a1a2e);
  camera = new THREE.PerspectiveCamera(50, container.clientWidth/container.clientHeight, 10, 3000);
  camera.position.set(600, 500, 800); camera.lookAt(100, 100, 200);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(120, 120, 250); controls.update();
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const light = new THREE.DirectionalLight(0xffffff, 0.8); light.position.set(300, 500, 400); scene.add(light);
  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });
}
function drawTruck(w,d,h) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
  const truck = new THREE.Mesh(geo, mat); truck.position.set(w/2, h/2, d/2); scene.add(truck);
}
function drawBoxes(placed) {
  const colors = ['#e94560','#f5a623','#43d8c9','#6c5ce7'], map = {}; let idx=0;
  for (let item of placed) {
    if (!map[item.name]) map[item.name] = colors[idx++ % colors.length];
    const geo = new THREE.BoxGeometry(item.w, item.h, item.d);
    const mat = new THREE.MeshPhongMaterial({ color: map[item.name], transparent: true, opacity: 0.75 });
    const cube = new THREE.Mesh(geo, mat);
    cube.position.set(item.x+item.w/2, item.y+item.h/2, item.z+item.d/2);
    scene.add(cube);
    cube.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0xffffff })));
  }
}
function clearScene() {
  while(scene.children.length) scene.remove(scene.children[0]);
  scene.add(new THREE.AmbientLight(0xffffff,0.6));
  const l = new THREE.DirectionalLight(0xffffff,0.8); l.position.set(300,500,400); scene.add(l);
}

// ---------- UI ----------
function addBoxRow(name='',w='',d='',h='',cnt=''){
  const div = document.createElement('div'); div.className='box-row';
  div.innerHTML = `<input class="boxName" placeholder="名称" value="${name}"><input class="boxW" type="number" placeholder="宽" value="${w}"><input class="boxD" type="number" placeholder="深" value="${d}"><input class="boxH" type="number" placeholder="高" value="${h}"><input class="boxCount" type="number" placeholder="数量" value="${cnt}"><button class="delBox">✕</button>`;
  div.querySelector('.delBox').onclick = ()=>div.remove();
  document.getElementById('boxList').appendChild(div);
}
function getBoxes() {
  return Array.from(document.querySelectorAll('#boxList .box-row')).map(r => ({
    name: r.querySelector('.boxName').value,
    w: +r.querySelector('.boxW').value,
    d: +r.querySelector('.boxD').value,
    h: +r.querySelector('.boxH').value,
    count: +r.querySelector('.boxCount').value
  })).filter(b => b.w>0 && b.d>0 && b.h>0 && b.count>0);
}

async function calculate() {
  const tw = +document.getElementById('tw').value;
  const td = +document.getElementById('td').value;
  const th = +document.getElementById('th').value;
  const boxes = getBoxes();
  if (!tw||!td||!th||!boxes.length) return alert('请填完整');
  const mode = document.getElementById('mode').value;

  let result;
  const startTime = performance.now();
  if (mode === 'multi') {
    result = multiRandomPack(tw, td, th, boxes, 100); // 尝试100次
  } else {
    const items = [];
    for (let box of boxes) for (let i=0;i<box.count;i++) items.push({name:box.name, w:box.w, d:box.d, h:box.h});
    items.sort((a,b)=>(b.w*b.d*b.h)-(a.w*a.d*a.h));
    result = runGreedy(tw, td, th, items);
  }
  const endTime = performance.now();

  if (!result || !result.success) {
    document.getElementById('resultText').textContent = `❌ 未装下全部箱子（装入${result?.placed.length || 0}个），耗时${((endTime-startTime)/1000).toFixed(2)}s`;
    // 仍然显示部分结果供分析
    if (result?.placed.length > 0) {
      clearScene(); drawTruck(tw,td,th); drawBoxes(result.placed);
    }
    return;
  }

  // 截面验证
  const verify = verifySlices(result.placed, tw, th, 10);
  if (!verify.valid) {
    document.getElementById('resultText').textContent = `❌ 截面验证失败：z=${verify.z} 面积${verify.totalArea} > ${verify.maxArea}`;
    return;
  }

  const fillRate = (result.placed.reduce((s,p)=>s+p.w*p.d*p.h,0) / (tw*td*th) * 100).toFixed(1);
  document.getElementById('resultText').textContent = 
    `✅ 全部装入 (${result.placed.length}箱) 耗时${((endTime-startTime)/1000).toFixed(2)}s\n` +
    `填充率: ${fillRate}%  截面验证: 通过\n` +
    result.steps.join('\n');

  clearScene(); drawTruck(tw,td,th); drawBoxes(result.placed);
}

// 默认数据
addBoxRow('纸箱A','40','40','64','50');
addBoxRow('纸箱B','43','43','72','50');
addBoxRow('纸箱C','40','40','52','100');
addBoxRow('纸箱D','32','32','51','100');

document.getElementById('addBoxBtn').onclick = ()=>addBoxRow();
document.getElementById('calcBtn').onclick = calculate;
init3D(); drawTruck(235,589,239);

function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
animate();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>货车装箱 - 成功版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; }
    .container { display: flex; height: 100vh; }
    .panel { width: 380px; background: #16213e; padding: 20px; overflow-y: auto; }
    h2 { margin-bottom: 15px; color: #e94560; }
    label { display: block; margin: 10px 0 4px; font-size: 14px; }
    input, button, select { width: 100%; padding: 8px; border: none; border-radius: 6px; margin-bottom: 8px; }
    input, select { background: #0f3460; color: #fff; }
    button { background: #e94560; color: white; font-weight: bold; cursor: pointer; }
    button:hover { background: #ff6b81; }
    .box-row { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
    .box-row input { width: 65px; }
    .box-row button { width: auto; padding: 6px 10px; font-size: 12px; }
    #addBoxBtn { margin-top: 10px; }
    .result { margin-top: 15px; white-space: pre-wrap; font-size: 13px; max-height: 300px; overflow-y: auto; }
    #viewer { flex: 1; position: relative; }
    canvas { display: block; }
  </style>
</head>
<body>
<div class="container">
  <div class="panel">
    <h2>📦 货车装箱参数</h2>
    <label>宽 (左右, cm)</label><input id="tw" type="number" value="235">
    <label>深 (前后, cm)</label><input id="td" type="number" value="589">
    <label>高 (上下, cm)</label><input id="th" type="number" value="239">
    <h3>纸箱</h3>
    <div id="boxList"></div>
    <button id="addBoxBtn">➕ 添加纸箱</button>
    <div style="margin-top:15px;">
      <label>模式</label>
      <select id="mode">
        <option value="auto" selected>优先相邻分布</option>
        <option value="adjacent">仅相邻分布</option>
        <option value="space">仅占空间最小</option>
      </select>
    </div>
    <button id="calcBtn">🚛 开始计算</button>
    <div id="resultText" class="result"></div>
  </div>
  <div id="viewer"></div>
</div>

<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- 辅助函数 ----------
function getAllowedOrientations(w, d, h) {
  // 高度不可侧放，只能水平旋转
  const orientations = [[w, d, h]];
  if (w !== d) orientations.push([d, w, h]);
  return orientations;
}

// ---------- 空间管理器（改进合并） ----------
class SpaceManager {
  constructor(tw, td, th) {
    this.spaces = [{ x: 0, y: 0, z: 0, w: tw, d: td, h: th }];
  }

  // 强力合并：尝试将任意两个空间融合成一个更大的长方体
  mergeSpaces() {
    let merged = true;
    while (merged) {
      merged = false;
      for (let i = 0; i < this.spaces.length; i++) {
        const a = this.spaces[i];
        for (let j = i + 1; j < this.spaces.length; j++) {
          const b = this.spaces[j];
          // 上下合并 (y方向)
          if (a.x === b.x && a.z === b.z && a.w === b.w && a.d === b.d && a.y + a.h === b.y) {
            a.h += b.h;
            this.spaces.splice(j, 1);
            merged = true;
            break;
          }
          if (a.x === b.x && a.z === b.z && a.w === b.w && a.d === b.d && b.y + b.h === a.y) {
            a.y = b.y; a.h += b.h;
            this.spaces.splice(j, 1);
            merged = true;
            break;
          }
          // 前后合并 (z方向)
          if (a.x === b.x && a.y === b.y && a.w === b.w && a.h === b.h && a.z + a.d === b.z) {
            a.d += b.d;
            this.spaces.splice(j, 1);
            merged = true;
            break;
          }
          if (a.x === b.x && a.y === b.y && a.w === b.w && a.h === b.h && b.z + b.d === a.z) {
            a.z = b.z; a.d += b.d;
            this.spaces.splice(j, 1);
            merged = true;
            break;
          }
          // 左右合并 (x方向)
          if (a.y === b.y && a.z === b.z && a.d === b.d && a.h === b.h && a.x + a.w === b.x) {
            a.w += b.w;
            this.spaces.splice(j, 1);
            merged = true;
            break;
          }
          if (a.y === b.y && a.z === b.z && a.d === b.d && a.h === b.h && b.x + b.w === a.x) {
            a.x = b.x; a.w += b.w;
            this.spaces.splice(j, 1);
            merged = true;
            break;
          }
        }
        if (merged) break;
      }
    }
  }

  // 尝试放置，返回最佳位置（接触面积优先）
  queryPlace(bw, bd, bh) {
    this.mergeSpaces(); // 放置前先合并碎片
    let best = null;
    for (let i = 0; i < this.spaces.length; i++) {
      const s = this.spaces[i];
      if (bw <= s.w && bd <= s.d && bh <= s.h) {
        let contact = 0;
        if (s.z === 0) contact += bw * bh; // 贴车头
        if (s.y === 0) contact += bw * bd; // 贴地板
        if (s.x === 0) contact += bd * bh; // 贴左壁
        if (!best || contact > best.contact) {
          best = { idx: i, pos: { x: s.x, y: s.y, z: s.z }, contact };
        }
      }
    }
    return best;
  }

  // 执行放置，切割空间并再次合并
  applyPlace(idx, bw, bd, bh) {
    const s = this.spaces[idx];
    const pos = { x: s.x, y: s.y, z: s.z };
    const newSpaces = [];
    // 右侧空间
    if (s.w - bw > 0) {
      newSpaces.push({ x: s.x + bw, y: s.y, z: s.z, w: s.w - bw, d: s.d, h: s.h });
    }
    // 上方空间
    if (s.h - bh > 0) {
      newSpaces.push({ x: s.x, y: s.y + bh, z: s.z, w: bw, d: s.d, h: s.h - bh });
    }
    // 前方空间
    if (s.d - bd > 0) {
      newSpaces.push({ x: s.x, y: s.y, z: s.z + bd, w: bw, d: s.d - bd, h: bh });
    }
    this.spaces.splice(idx, 1);
    this.spaces.push(...newSpaces);
    this.mergeSpaces();
    return pos;
  }
}

// ---------- 相邻分布（同种箱子聚集成块）----------
function packAdjacent(tw, td, th, boxes) {
  const blocks = [];
  const steps = [];

  for (let box of boxes) {
    let best = null;
    const orientations = getAllowedOrientations(box.w, box.d, box.h);
    for (let [bw, bd, bh] of orientations) {
      const maxA = Math.floor(tw / bw);
      const maxB = Math.floor(td / bd);
      const maxC = Math.floor(th / bh);
      if (maxA * maxB * maxC < box.count) continue;
      for (let a = 1; a <= maxA; a++) {
        for (let b = 1; b <= maxB; b++) {
          const c = Math.ceil(box.count / (a * b));
          if (c > maxC) continue;
          const w = a * bw, d = b * bd, h = c * bh;
          const vol = w * d * h;
          if (!best || vol < best.vol) {
            best = { a, b, c, bw, bd, bh, w, d, h, vol, name: box.name, count: box.count };
          }
        }
      }
    }
    if (!best) return { success: false, placed: [], steps: [] };
    blocks.push(best);
    steps.push(`将“${box.name}”${box.count}个排列成 ${best.a}×${best.b}×${best.c} 的块（宽${best.w} 深${best.d} 高${best.h}cm）`);
  }

  const sm = new SpaceManager(tw, td, th);
  const placed = [];
  const blockSteps = [];

  for (let block of blocks) {
    const q = sm.queryPlace(block.w, block.d, block.h);
    if (!q) {
      // 相邻分布失败，尝试将块再拆分成更小的层/堆
      return { success: false, placed: [], steps: [] };
    }
    const pos = sm.applyPlace(q.idx, block.w, block.d, block.h);
    let remaining = block.count;
    for (let k = 0; k < block.c && remaining > 0; k++) {
      for (let j = 0; j < block.b && remaining > 0; j++) {
        for (let i = 0; i < block.a && remaining > 0; i++) {
          placed.push({
            name: block.name,
            x: pos.x + i * block.bw,
            y: pos.y + k * block.bh,
            z: pos.z + j * block.bd,
            w: block.bw, d: block.bd, h: block.bh
          });
          remaining--;
        }
      }
    }
    blockSteps.push(`整块放置在 (${pos.x},${pos.y},${pos.z})，内部箱子从左到右、从里到外、从下到上排列`);
  }
  return { success: true, placed, steps: [...steps, ...blockSteps] };
}

// ---------- 占空间最小（混装，确保能装下）----------
function packSpaceMin(tw, td, th, boxes) {
  const sm = new SpaceManager(tw, td, th);
  const placed = [];
  const steps = [];

  // 展开所有箱子为独立项，并按体积降序排列（大箱子优先）
  const items = [];
  for (let box of boxes) {
    for (let i = 0; i < box.count; i++) {
      items.push({ name: box.name, orientations: getAllowedOrientations(box.w, box.d, box.h) });
    }
  }
  items.sort((a, b) => {
    const vol = arr => arr[0] * arr[1] * arr[2];
    return vol(b.orientations[0]) - vol(a.orientations[0]);
  });

  // 逐个贪心放置，每次选择接触面积最大的方向和位置
  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    let bestRes = null;
    for (let [bw, bd, bh] of item.orientations) {
      const q = sm.queryPlace(bw, bd, bh);
      if (q) {
        const score = q.contact + (bw * bd * bh) * 0.001; // 稍微偏好大箱子贴边
        if (!bestRes || score > bestRes.score) {
          bestRes = { ori: [bw, bd, bh], q, score };
        }
      }
    }
    if (!bestRes) {
      return { success: false, placed, steps };
    }
    const [bw, bd, bh] = bestRes.ori;
    const pos = sm.applyPlace(bestRes.q.idx, bw, bd, bh);
    placed.push({ name: item.name, x: pos.x, y: pos.y, z: pos.z, w: bw, d: bd, h: bh });
    steps.push(`放置 ${item.name} 于 (${pos.x},${pos.y},${pos.z}) 尺寸 ${bw}×${bd}×${bh}`);
  }
  return { success: true, placed, steps };
}

// ---------- 3D 渲染 ----------
let scene, camera, renderer, controls;
function init3D() {
  const container = document.getElementById('viewer');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a2e);
  camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 10, 3000);
  camera.position.set(600, 500, 800);
  camera.lookAt(100, 100, 200);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(120, 120, 250);
  controls.update();
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const light = new THREE.DirectionalLight(0xffffff, 0.8);
  light.position.set(300, 500, 400);
  scene.add(light);
  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });
}

function drawTruck(w, d, h) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
  const truck = new THREE.Mesh(geo, mat);
  truck.position.set(w / 2, h / 2, d / 2);
  scene.add(truck);
}

function drawBoxes(placed) {
  const colors = ['#e94560', '#f5a623', '#43d8c9', '#6c5ce7'];
  const colorMap = {};
  let idx = 0;
  for (let item of placed) {
    if (!colorMap[item.name]) {
      colorMap[item.name] = colors[idx++ % colors.length];
    }
    const color = colorMap[item.name];
    const geo = new THREE.BoxGeometry(item.w, item.h, item.d);
    const mat = new THREE.MeshPhongMaterial({ color, transparent: true, opacity: 0.75 });
    const cube = new THREE.Mesh(geo, mat);
    cube.position.set(item.x + item.w / 2, item.y + item.h / 2, item.z + item.d / 2);
    scene.add(cube);
    const edge = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0xffffff }));
    cube.add(edge);
  }
}

function clearScene() {
  if (!scene) return;
  while (scene.children.length > 0) scene.remove(scene.children[0]);
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const light = new THREE.DirectionalLight(0xffffff, 0.8);
  light.position.set(300, 500, 400);
  scene.add(light);
}

// ---------- UI 逻辑 ----------
function addBoxRow(name = '', w = '', d = '', h = '', count = '') {
  const div = document.createElement('div');
  div.className = 'box-row';
  div.innerHTML = `
    <input class="boxName" placeholder="名称" value="${name}">
    <input class="boxW" type="number" placeholder="宽" value="${w}">
    <input class="boxD" type="number" placeholder="深" value="${d}">
    <input class="boxH" type="number" placeholder="高" value="${h}">
    <input class="boxCount" type="number" placeholder="数量" value="${count}">
    <button class="delBox">✕</button>
  `;
  div.querySelector('.delBox').onclick = () => div.remove();
  document.getElementById('boxList').appendChild(div);
}

function getBoxes() {
  return Array.from(document.querySelectorAll('#boxList .box-row')).map(row => ({
    name: row.querySelector('.boxName').value,
    w: +row.querySelector('.boxW').value,
    d: +row.querySelector('.boxD').value,
    h: +row.querySelector('.boxH').value,
    count: +row.querySelector('.boxCount').value
  })).filter(b => b.w > 0 && b.d > 0 && b.h > 0 && b.count > 0);
}

async function calculate() {
  const tw = +document.getElementById('tw').value;
  const td = +document.getElementById('td').value;
  const th = +document.getElementById('th').value;
  const boxes = getBoxes();
  if (!tw || !td || !th || !boxes.length) return alert('请完整填写尺寸和至少一个纸箱');

  const mode = document.getElementById('mode').value;
  let result;
  const adjRes = packAdjacent(tw, td, th, boxes);
  
  if (mode === 'adjacent') {
    result = adjRes;
  } else if (mode === 'space') {
    result = packSpaceMin(tw, td, th, boxes);
  } else { // auto
    if (adjRes.success) {
      result = adjRes;
      document.getElementById('resultText').textContent = '✅ 已采用“相邻分布”方案：\n' + adjRes.steps.join('\n');
    } else {
      result = packSpaceMin(tw, td, th, boxes);
      if (result.success) {
        document.getElementById('resultText').textContent = '⚠️ 相邻分布失败，已切换为“占空间最小”方案：\n' + result.steps.join('\n');
      } else {
        document.getElementById('resultText').textContent = '❌ 无法装入所有箱子，请检查尺寸。';
        return;
      }
    }
  }

  if (!result.success) {
    document.getElementById('resultText').textContent = '❌ 装不下所有箱子。';
    return;
  }

  document.getElementById('resultText').textContent = '✅ 成功装入全部 ' + result.placed.length + ' 个箱子\n' + result.steps.join('\n');
  clearScene();
  drawTruck(tw, td, th);
  drawBoxes(result.placed);
}

// 默认数据
addBoxRow('纸箱A', '40', '40', '64', '50');
addBoxRow('纸箱B', '43', '43', '72', '50');
addBoxRow('纸箱C', '40', '40', '52', '100');
addBoxRow('纸箱D', '32', '32', '51', '100');

document.getElementById('addBoxBtn').onclick = () => addBoxRow();
document.getElementById('calcBtn').onclick = calculate;
init3D();
drawTruck(235, 589, 239);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>

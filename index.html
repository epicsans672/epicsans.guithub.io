<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>货车装箱 - 高度图算法</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:system-ui, sans-serif; background:#1a1a2e; color:#eee; }
    .container { display:flex; height:100vh; }
    .panel { width:380px; background:#16213e; padding:20px; overflow-y:auto; }
    h2 { margin-bottom:15px; color:#e94560; }
    label { display:block; margin:10px 0 4px; font-size:14px; }
    input, button, select { width:100%; padding:8px; border:none; border-radius:6px; margin-bottom:8px; }
    input, select { background:#0f3460; color:#fff; }
    button { background:#e94560; color:white; font-weight:bold; cursor:pointer; }
    button:hover { background:#ff6b81; }
    .box-row { display:flex; gap:5px; align-items:center; flex-wrap:wrap; }
    .box-row input { width:65px; }
    .box-row button { width:auto; padding:6px 10px; font-size:12px; }
    #addBoxBtn { margin-top:10px; }
    .result { margin-top:15px; white-space:pre-wrap; font-size:13px; max-height:300px; overflow-y:auto; }
    #viewer { flex:1; position:relative; }
    canvas { display:block; }
  </style>
</head>
<body>
<div class="container">
  <div class="panel">
    <h2>📦 货车装箱参数</h2>
    <label>宽 (左右, cm)</label><input id="tw" type="number" value="235">
    <label>深 (前后, cm)</label><input id="td" type="number" value="589">
    <label>高 (上下, cm)</label><input id="th" type="number" value="239">
    <h3>纸箱</h3>
    <div id="boxList"></div>
    <button id="addBoxBtn">➕ 添加纸箱</button>
    <div style="margin-top:15px;">
      <label>算法</label>
      <select id="mode">
        <option value="heightmap" selected>高度图算法 (推荐)</option>
        <option value="heightmap-fast">快速模式 (单次)</option>
      </select>
    </div>
    <button id="calcBtn">🚛 开始计算</button>
    <div id="resultText" class="result"></div>
  </div>
  <div id="viewer"></div>
</div>

<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ==================== 工具：方向 ====================
function getAllowedOrientations(w,d,h, isTopLayer) {
  const ori = [[w,d,h]];
  if (w !== d) ori.push([d,w,h]);
  if (isTopLayer) {
    const all = [[w,d,h],[d,w,h],[w,h,d],[h,w,d],[d,h,w],[h,d,w]];
    return Array.from(new Set(all.map(a=>a.join(',')))).map(s=>s.split(',').map(Number));
  }
  return ori;
}

// ==================== 高度图装箱算法 ====================
function packWithHeightmap(tw, td, th, items, maxTrials = 1) {
  let bestPlaced = [];
  let bestSteps = [];
  let maxCount = 0;

  const totalItems = items.length;
  // 多次随机尝试
  for (let trial = 0; trial < maxTrials; trial++) {
    // 随机打乱顺序（但保持大致体积降序）
    const shuffled = [...items].sort((a,b) => (b.w*b.d*b.h) - (a.w*a.d*a.h));
    // 轻微洗牌：相邻体积的可以交换
    for (let i = shuffled.length-1; i>0; i--) {
      if (Math.random() < 0.5) {
        const j = Math.floor(Math.random() * (i+1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
    }

    const heightMap = Array(tw).fill().map(() => Array(td).fill(0)); // 0表示地板高度
    const placed = [];
    const steps = [];

    for (let item of shuffled) {
      let bestPos = null;
      let bestOri = null;

      // 检查是否最顶层（当前高度图最高点是否已到th，我们不需要单独判断顶层，而是尝试所有方向，只要最终y+oh<=th）
      // 遍历所有可能的方向，寻找最低的平坦区域
      const orientations = [[item.w, item.d, item.h]];
      if (item.w !== item.d) orientations.push([item.d, item.w, item.h]);
      // 允许侧放的条件：车厢未满时也可以，但为简化我们先只允许竖放和水平旋转，提高稳定性
      // 若想最大化填充率，可以加入所有方向（仅当最高度接近th时），这里为了稳定，先只使用两种竖放。
      // 根据之前要求，最顶层允许倒下，我们可以在高度图达到一定高度后启用所有方向。
      const maxH = Math.max(...heightMap.flat());
      const topLayer = (maxH + Math.max(item.w, item.d, item.h) >= th); // 简单判断
      const finalOris = topLayer ? getAllowedOrientations(item.w, item.d, item.h, true) : orientations;

      for (let [ow, od, oh] of finalOris) {
        if (ow > tw || od > td) continue;
        // 扫描高度图，寻找平坦区域
        for (let z = 0; z <= td - od; z++) { // 优先车头（z小）
          for (let x = 0; x <= tw - ow; x++) {
            // 检查该矩形区域是否平坦（所有高度相同）
            const baseH = heightMap[x][z];
            if (baseH + oh > th) continue;
            let flat = true;
            for (let dx = 0; dx < ow && flat; dx++) {
              for (let dz = 0; dz < od && flat; dz++) {
                if (heightMap[x+dx][z+dz] !== baseH) {
                  flat = false;
                }
              }
            }
            if (flat) {
              // 如果找到，选择最低的baseH，若相同则选择z最小的（车头），这里因为循环顺序已优先z小，所以第一个平坦区域就是车头最低处。
              // 由于我们是按z优先扫描，直接取第一个即可，无需比较。
              bestPos = { x, z, y: baseH };
              bestOri = [ow, od, oh];
              // 跳出所有循环
              x = tw; z = td; // 跳出
            }
          }
        }
        if (bestPos) break;
      }

      if (!bestPos) {
        // 无法放置此箱子，本次尝试失败
        break;
      }

      const [ow, od, oh] = bestOri;
      const { x, y, z } = bestPos;

      // 更新高度图
      for (let dx = 0; dx < ow; dx++) {
        for (let dz = 0; dz < od; dz++) {
          heightMap[x+dx][z+dz] = y + oh;
        }
      }

      placed.push({ name: item.name, x, y, z, w: ow, d: od, h: oh });
      steps.push(`${item.name} 放置于 (${x},${y},${z}) 尺寸 ${ow}×${od}×${oh}${oh!==item.h?'(侧放)':''}`);
    }

    if (placed.length > maxCount) {
      maxCount = placed.length;
      bestPlaced = placed;
      bestSteps = steps;
    }
    if (maxCount === totalItems) break; // 已经全部装入
  }

  return { placed: bestPlaced, steps: bestSteps, total: totalItems, success: maxCount === totalItems };
}

// ==================== 截面验证 ====================
function verifySlices(placed, tw, th, step = 10) {
  const maxZ = Math.max(...placed.map(p => p.z + p.d));
  for (let z = 0; z <= maxZ; z += step) {
    let totalArea = 0;
    for (let p of placed) {
      if (p.z <= z && p.z + p.d > z) {
        totalArea += p.w * p.h;
      }
    }
    if (totalArea > tw * th + 0.01) {
      return { valid: false, z, totalArea, maxArea: tw * th };
    }
  }
  return { valid: true };
}

// ==================== 3D 渲染 ====================
let scene, camera, renderer, controls;
function init3D() {
  const container = document.getElementById('viewer');
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x1a1a2e);
  camera = new THREE.PerspectiveCamera(50, container.clientWidth/container.clientHeight, 10, 3000);
  camera.position.set(600, 500, 800); camera.lookAt(100, 100, 200);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(120, 120, 250); controls.update();
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const light = new THREE.DirectionalLight(0xffffff, 0.8); light.position.set(300, 500, 400); scene.add(light);
  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });
}
function drawTruck(w,d,h) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
  const truck = new THREE.Mesh(geo, mat); truck.position.set(w/2, h/2, d/2); scene.add(truck);
}
function drawBoxes(placed) {
  const colors = ['#e94560','#f5a623','#43d8c9','#6c5ce7'], map = {}; let idx=0;
  for (let item of placed) {
    if (!map[item.name]) map[item.name] = colors[idx++ % colors.length];
    const geo = new THREE.BoxGeometry(item.w, item.h, item.d);
    const mat = new THREE.MeshPhongMaterial({ color: map[item.name], transparent: true, opacity: 0.75 });
    const cube = new THREE.Mesh(geo, mat);
    cube.position.set(item.x+item.w/2, item.y+item.h/2, item.z+item.d/2);
    scene.add(cube);
    cube.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0xffffff })));
  }
}
function clearScene() {
  while(scene.children.length) scene.remove(scene.children[0]);
  scene.add(new THREE.AmbientLight(0xffffff,0.6));
  const l = new THREE.DirectionalLight(0xffffff,0.8); l.position.set(300,500,400); scene.add(l);
}

// ==================== UI ====================
function addBoxRow(name='',w='',d='',h='',cnt=''){
  const div = document.createElement('div'); div.className='box-row';
  div.innerHTML = `<input class="boxName" placeholder="名称" value="${name}"><input class="boxW" type="number" placeholder="宽" value="${w}"><input class="boxD" type="number" placeholder="深" value="${d}"><input class="boxH" type="number" placeholder="高" value="${h}"><input class="boxCount" type="number" placeholder="数量" value="${cnt}"><button class="delBox">✕</button>`;
  div.querySelector('.delBox').onclick = ()=>div.remove();
  document.getElementById('boxList').appendChild(div);
}
function getBoxes() {
  return Array.from(document.querySelectorAll('#boxList .box-row')).map(r => ({
    name: r.querySelector('.boxName').value,
    w: +r.querySelector('.boxW').value,
    d: +r.querySelector('.boxD').value,
    h: +r.querySelector('.boxH').value,
    count: +r.querySelector('.boxCount').value
  })).filter(b => b.w>0 && b.d>0 && b.h>0 && b.count>0);
}

async function calculate() {
  const tw = +document.getElementById('tw').value;
  const td = +document.getElementById('td').value;
  const th = +document.getElementById('th').value;
  const boxes = getBoxes();
  if (!tw||!td||!th||!boxes.length) return alert('请填完整');
  const mode = document.getElementById('mode').value;

  // 展开所有箱子
  const baseItems = [];
  for (let box of boxes) {
    for (let i = 0; i < box.count; i++) {
      baseItems.push({ name: box.name, w: box.w, d: box.d, h: box.h });
    }
  }

  const startTime = performance.now();
  let result;
  if (mode === 'heightmap') {
    result = packWithHeightmap(tw, td, th, baseItems, 50); // 50次随机尝试
  } else {
    result = packWithHeightmap(tw, td, th, baseItems, 1);
  }
  const endTime = performance.now();

  if (!result.success) {
    document.getElementById('resultText').textContent = `❌ 未装下全部箱子（${result.placed.length}/${result.total}），耗时${((endTime-startTime)/1000).toFixed(2)}s`;
    if (result.placed.length > 0) {
      clearScene(); drawTruck(tw,td,th); drawBoxes(result.placed);
    }
    return;
  }

  const verify = verifySlices(result.placed, tw, th, 10);
  if (!verify.valid) {
    document.getElementById('resultText').textContent = `❌ 截面验证失败：z=${verify.z} 面积${verify.totalArea} > ${verify.maxArea}`;
    return;
  }

  const fillRate = (result.placed.reduce((s,p)=>s+p.w*p.d*p.h,0) / (tw*td*th) * 100).toFixed(1);
  document.getElementById('resultText').textContent = 
    `✅ 全部装入 (${result.placed.length}箱) 耗时${((endTime-startTime)/1000).toFixed(2)}s\n` +
    `填充率: ${fillRate}%  截面验证: 通过\n` +
    result.steps.join('\n');

  clearScene(); drawTruck(tw,td,th); drawBoxes(result.placed);
}

// 默认数据
addBoxRow('纸箱A','40','40','64','50');
addBoxRow('纸箱B','43','43','72','50');
addBoxRow('纸箱C','40','40','52','100');
addBoxRow('纸箱D','32','32','51','100');

document.getElementById('addBoxBtn').onclick = ()=>addBoxRow();
document.getElementById('calcBtn').onclick = calculate;
init3D(); drawTruck(235,589,239);

function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
animate();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能装箱计算器</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 15px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; margin: 5px 0; box-sizing: border-box; }
        .box-row { display: flex; gap: 10px; align-items: center; margin: 10px 0; }
        .box-row input { width: 80px; }
        button { padding: 10px 20px; margin: 15px 5px 15px 0; font-size: 16px; cursor: pointer; }
        #result { white-space: pre-wrap; background: #f5f5f5; padding: 15px; border-radius: 8px; line-height: 1.6; }
        .ai-button { background: #4f46e5; color: white; border: none; border-radius: 6px; }
        .ai-button:hover { background: #4338ca; }
    </style>
</head>
<body>
    <h1>📦 智能装箱计算器</h1>
    <p>输入卡车内部空间和纸箱尺寸，自动计算如何摆放。</p>

    <h2>卡车内部尺寸 (cm)</h2>
    <label>长 <input type="number" id="truckL" value="600" min="1"></label>
    <label>宽 <input type="number" id="truckW" value="240" min="1"></label>
    <label>高 <input type="number" id="truckH" value="250" min="1"></label>

    <h2>纸箱清单</h2>
    <div id="boxList">
        <div class="box-row">
            <span>📦 1</span>
            <input type="number" placeholder="长cm" class="boxL" value="60">
            <input type="number" placeholder="宽cm" class="boxW" value="40">
            <input type="number" placeholder="高cm" class="boxH" value="30">
            <input type="number" placeholder="数量" class="boxQty" value="50" min="1">
        </div>
    </div>
    <button onclick="addBoxRow()">➕ 添加纸箱类型</button>

    <h2>摆放模式</h2>
    <select id="mode">
        <option value="grouped">🧱 优先同种纸箱相邻分布 (集中堆放)</option>
        <option value="compact">🧩 优先最小空间占用 (允许混合放置)</option>
    </select>

    <button onclick="calculate()" style="background:#059669; color:white;">计算装箱方案</button>
    <button class="ai-button" onclick="askDeepSeek()">🤖 咨询 DeepSeek 更多问题</button>

    <h2>📋 摆放说明</h2>
    <div id="result">等待计算……</div>

    <script>
        let lastResultText = ''; // 存储最近的计算结果，用于跳转 DeepSeek

        function addBoxRow() {
            const list = document.getElementById('boxList');
            const idx = list.children.length + 1;
            const div = document.createElement('div');
            div.className = 'box-row';
            div.innerHTML = `
                <span>📦 ${idx}</span>
                <input type="number" placeholder="长cm" class="boxL" value="40">
                <input type="number" placeholder="宽cm" class="boxW" value="30">
                <input type="number" placeholder="高cm" class="boxH" value="20">
                <input type="number" placeholder="数量" class="boxQty" value="30" min="1">
            `;
            list.appendChild(div);
        }

        // ---------- 简陋但可用的三维装箱算法 ----------
        function calculate() {
    const scale = 10; // 每格代表 10 cm，想更精细可改成 5
    let truckL = Math.floor(+document.getElementById('truckL').value / scale);
    let truckW = Math.floor(+document.getElementById('truckW').value / scale);
    let truckH = Math.floor(+document.getElementById('truckH').value / scale);

            const boxes = [];
            const rows = document.querySelectorAll('#boxList .box-row');
            rows.forEach(row => {
                const l = Math.floor(+row.querySelector('.boxL').value / scale);
const w = Math.floor(+row.querySelector('.boxW').value / scale);
const h = Math.floor(+row.querySelector('.boxH').value / scale);
                const qty = +row.querySelector('.boxQty').value;
                if (l > 0 && w > 0 && h > 0 && qty > 0) {
                    boxes.push({ l, w, h, qty, id: boxes.length + 1 });
                }
            });

            if (boxes.length === 0) {
                document.getElementById('result').textContent = '❌ 请至少添加一种纸箱。';
                return;
            }

            // 摆放结果存储：{ id, l, w, h, x, y, z, orient }
            const placements = [];
            const spaceUsed = Array(truckL).fill().map(() => Array(truckW).fill().map(() => Array(truckH).fill(false)));

            // 辅助：检查是否能放下
            function canPlace(l, w, h, sx, sy, sz) {
                if (sx + l > truckL || sy + w > truckW || sz + h > truckH) return false;
                for (let x = sx; x < sx + l; x++)
                    for (let y = sy; y < sy + w; y++)
                        for (let z = sz; z < sz + h; z++)
                            if (spaceUsed[x][y][z]) return false;
                return true;
            }

            function markSpace(l, w, h, sx, sy, sz, val) {
                for (let x = sx; x < sx + l; x++)
                    for (let y = sy; y < sy + w; y++)
                        for (let z = sz; z < sz + h; z++)
                            spaceUsed[x][y][z] = val;
            }

            // 生成6种朝向 (l,w,h 循环排列)
            function orientations(box) {
                const { l, w, h } = box;
                const ori = [
                    [l, w, h], [l, h, w], [w, l, h],
                    [w, h, l], [h, l, w], [h, w, l]
                ];
                // 去重
                const unique = new Map();
                ori.forEach(o => {
                    const key = o.join(',');
                    if (!unique.has(key)) unique.set(key, o);
                });
                return Array.from(unique.values());
            }

            // 按模式排序待放置箱子列表
            let itemsToPlace = [];
            if (mode === 'grouped') {
                // 同种箱子集中：按类型依次加入
                boxes.forEach(box => {
                    for (let i = 0; i < box.qty; i++) {
                        itemsToPlace.push({ ...box, qty: 1, typeId: box.id });
                    }
                });
            } else {
                // 空间最小：所有箱子按体积从大到小排序，混合放置
                const allItems = [];
                boxes.forEach(box => {
                    for (let i = 0; i < box.qty; i++) {
                        allItems.push({ ...box, qty: 1, typeId: box.id });
                    }
                });
                allItems.sort((a, b) => (b.l * b.w * b.h) - (a.l * a.w * a.h));
                itemsToPlace = allItems;
            }

            // 简单贪婪：从原点(0,0,0)开始，逐层扫描空位
            let unplaced = [];
            for (let item of itemsToPlace) {
                let placed = false;
                const oriList = orientations(item);
                // 按体积从大到小尝试朝向（保持稳定）
                oriList.sort((a, b) => (b[0] * b[1] * b[2]) - (a[0] * a[1] * a[2]));

                // 寻找第一个能放下的位置 (x, y, z)
                for (let x = 0; x < truckL && !placed; x++) {
                    for (let y = 0; y < truckW && !placed; y++) {
                        for (let z = 0; z < truckH && !placed; z++) {
                            if (spaceUsed[x][y][z]) continue;
                            for (let [cl, cw, ch] of oriList) {
                                if (canPlace(cl, cw, ch, x, y, z)) {
                                    markSpace(cl, cw, ch, x, y, z, true);
                                    placements.push({
                                        id: item.id,
                                        l: cl, w: cw, h: ch,
                                        x, y, z,
                                        orient: `${cl}×${cw}×${ch}`
                                    });
                                    placed = true;
                                    break;
                                }
                            }
                        }
                    }
                }
                if (!placed) unplaced.push(item);
            }

            // 生成通俗描述
            placements.push({
    id: item.id,
    l: cl * scale,   // 恢复为厘米显示
    w: cw * scale,
    h: ch * scale,
    x: x * scale,
    y: y * scale,
    z: z * scale,
    orient: `${cl * scale}×${cw * scale}×${ch * scale}`
});
            let output = '';
            if (placements.length === 0) {
                output = '❌ 无法放入任何纸箱，请检查尺寸。';
            } else {
                output += `✅ 成功装入 ${placements.length} 个纸箱，${unplaced.length} 个未能装入。\n\n`;
                // 方向描述映射
                function describePosition(x, y, z) {
                    const leftRight = x === 0 ? '最左侧' : (x < truckL / 3 ? '左侧' : (x < 2 * truckL / 3 ? '中间' : '右侧'));
                    const depth = y === 0 ? '最后方(里)' : (y < truckW / 3 ? '靠后' : (y < 2 * truckW / 3 ? '中间' : '靠前(外)'));
                    const height = z === 0 ? '最底层' : (z < truckH / 3 ? '下层' : (z < 2 * truckH / 3 ? '中层' : '上层'));
                    return `${leftRight}、${depth}、${height}`;
                }

                placements.forEach((p, idx) => {
                    const posDesc = describePosition(p.x, p.y, p.z);
                    output += `📦 第${idx + 1}个 (类型${p.id}, ${p.orient} cm)： 放置在 ${posDesc}，坐标起点(${p.x}, ${p.y}, ${p.z})\n`;
                });

                if (unplaced.length > 0) {
                    output += `\n⚠️ 未装入的纸箱：`;
                    const countMap = {};
                    unplaced.forEach(u => countMap[u.id] = (countMap[u.id] || 0) + 1);
                    for (let [id, cnt] of Object.entries(countMap)) {
                        output += `类型${id} ×${cnt}个 `;
                    }
                }
            }

            lastResultText = output; // 保存供 AI 按钮使用
            document.getElementById('result').textContent = output;
        }

        // ---------- 跳转到 DeepSeek 并复制问题 ----------
        function askDeepSeek() {
            if (!lastResultText || lastResultText.trim() === '') {
                alert('请先计算装箱方案，再咨询 AI。');
                return;
            }

            // 构建要问 DeepSeek 的问题，附上当前结果
            const question = `我使用了一个装箱计算器，得到了以下摆放结果。\n请帮我分析这个方案是否合理，有没有优化空间，以及如何进一步减少空隙。\n\n【计算结果】\n${lastResultText}`;

            // 复制到剪贴板
            navigator.clipboard.writeText(question).then(() => {
                alert('✅ 提问内容已复制！即将打开 DeepSeek，请在对话框中粘贴（Ctrl+V）并发送。');
            }).catch(() => {
                alert('复制失败，请手动复制页面上的计算结果。');
            });

            // 打开 DeepSeek 官网
            window.open('https://chat.deepseek.com/', '_blank');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>货车装箱 - 混合算法</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:system-ui, sans-serif; background:#1a1a2e; color:#eee; }
    .container { display:flex; height:100vh; }
    .panel { width:380px; background:#16213e; padding:20px; overflow-y:auto; }
    h2 { margin-bottom:15px; color:#e94560; }
    label { display:block; margin:10px 0 4px; font-size:14px; }
    input, button, select { width:100%; padding:8px; border:none; border-radius:6px; margin-bottom:8px; }
    input, select { background:#0f3460; color:#fff; }
    button { background:#e94560; color:white; font-weight:bold; cursor:pointer; }
    button:hover { background:#ff6b81; }
    .box-row { display:flex; gap:5px; align-items:center; flex-wrap:wrap; }
    .box-row input { width:65px; }
    .box-row button { width:auto; padding:6px 10px; font-size:12px; }
    #addBoxBtn { margin-top:10px; }
    .result { margin-top:15px; white-space:pre-wrap; font-size:13px; max-height:300px; overflow-y:auto; }
    #viewer { flex:1; position:relative; }
    canvas { display:block; }
  </style>
</head>
<body>
<div class="container">
  <div class="panel">
    <h2>📦 货车装箱参数</h2>
    <label>宽 (左右, cm)</label><input id="tw" type="number" value="235">
    <label>深 (前后, cm)</label><input id="td" type="number" value="589">
    <label>高 (上下, cm)</label><input id="th" type="number" value="239">
    <h3>纸箱</h3>
    <div id="boxList"></div>
    <button id="addBoxBtn">➕ 添加纸箱</button>
    <div style="margin-top:15px;">
      <label>算法模式</label>
      <select id="mode">
        <option value="hybrid" selected>混合算法 (贪心+LMH)</option>
        <option value="adjacent">相邻分布</option>
        <option value="space">占空间最小</option>
      </select>
    </div>
    <button id="calcBtn">🚛 开始计算</button>
    <div id="resultText" class="result"></div>
  </div>
  <div id="viewer"></div>
</div>

<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ==================== 工具函数 ====================
function getAllowedOrientations(w,d,h, isTopLayer) {
  const ori = [[w,d,h]];
  if (w !== d) ori.push([d,w,h]);
  if (isTopLayer) {
    const all = [[w,d,h],[d,w,h],[w,h,d],[h,w,d],[d,h,w],[h,d,w]];
    return Array.from(new Set(all.map(a=>a.join(',')))).map(s=>s.split(',').map(Number));
  }
  return ori;
}

// ==================== 空间管理器 (杜绝重叠) ====================
class SpaceManager {
  constructor(tw, td, th) {
    this.spaces = [{ x:0, y:0, z:0, w:tw, d:td, h:th, isFloor:true }];
    this.tw = tw; this.td = td; this.th = th;
  }

  // 强力合并相邻且对齐的空间
  mergeSpaces() {
    let merged = true;
    while (merged) {
      merged = false;
      for (let i = 0; i < this.spaces.length; i++) {
        const a = this.spaces[i];
        for (let j = i+1; j < this.spaces.length; j++) {
          const b = this.spaces[j];
          // 上下合并 (x,z,w,d相同)
          if (a.x===b.x && a.z===b.z && a.w===b.w && a.d===b.d && a.isFloor===b.isFloor) {
            if (a.y + a.h === b.y) { a.h += b.h; this.spaces.splice(j,1); merged=true; break; }
            if (b.y + b.h === a.y) { a.y = b.y; a.h += b.h; this.spaces.splice(j,1); merged=true; break; }
          }
          // 前后合并 (x,y,w,h相同)
          if (a.x===b.x && a.y===b.y && a.w===b.w && a.h===b.h && a.isFloor===b.isFloor) {
            if (a.z + a.d === b.z) { a.d += b.d; this.spaces.splice(j,1); merged=true; break; }
            if (b.z + b.d === a.z) { a.z = b.z; a.d += b.d; this.spaces.splice(j,1); merged=true; break; }
          }
          // 左右合并 (y,z,d,h相同)
          if (a.y===b.y && a.z===b.z && a.d===b.d && a.h===b.h && a.isFloor===b.isFloor) {
            if (a.x + a.w === b.x) { a.w += b.w; this.spaces.splice(j,1); merged=true; break; }
            if (b.x + b.w === a.x) { a.x = b.x; a.w += b.w; this.spaces.splice(j,1); merged=true; break; }
          }
        }
        if (merged) break;
      }
    }
  }

  // 判断空间是否为顶层
  isTopSpace(space) {
    return Math.abs(space.y + space.h - this.th) < 0.01;
  }

  // 获取所有可行的放置方案 (带方向)
  queryAllPlacements(originalW, originalD, originalH) {
    this.mergeSpaces();
    const candidates = [];
    for (let i = 0; i < this.spaces.length; i++) {
      const s = this.spaces[i];
      // 支撑条件：底面必须是地板或已被箱子托举 (isFloor=false 表示上方是箱子)
      if (s.isFloor && s.y > 0) continue;

      const topLayer = this.isTopSpace(s);
      const orientations = getAllowedOrientations(originalW, originalD, originalH, topLayer);
      for (let [ow, od, oh] of orientations) {
        if (ow <= s.w && od <= s.d && oh <= s.h) {
          // 计算放置后剩余空间的最小维度 (用于LMH)
          const newSpaces = [];
          if (s.w - ow > 0) newSpaces.push({ w: s.w-ow, d: s.d, h: s.h });
          if (s.h - oh > 0) newSpaces.push({ w: ow, d: s.d, h: s.h-oh });
          if (s.d - od > 0) newSpaces.push({ w: ow, d: s.d-od, h: oh });
          let minDim = Infinity;
          newSpaces.forEach(ns => {
            const m = Math.min(ns.w, ns.d, ns.h);
            if (m < minDim) minDim = m;
          });
          if (newSpaces.length === 0) minDim = 0; // 完全填充

          // 接触面积
          let contact = 0;
          if (s.z === 0) contact += ow * oh;      // 贴车头
          if (s.y === 0 && s.isFloor) contact += ow * od; // 贴地板
          if (s.x === 0) contact += od * oh;      // 贴左壁
          if (!s.isFloor) contact += ow * od;     // 底面有箱子支撑

          candidates.push({
            spaceIdx: i,
            bw: ow, bd: od, bh: oh,
            volume: ow * od * oh,
            contact,
            minDim,
            space: s
          });
        }
      }
    }
    return candidates;
  }

  // 执行放置，切割空间
  applyPlace(spaceIdx, bw, bd, bh) {
    const s = this.spaces[spaceIdx];
    const pos = { x: s.x, y: s.y, z: s.z };
    const newSpaces = [];
    if (s.w - bw > 0) {
      newSpaces.push({ x: s.x+bw, y: s.y, z: s.z, w: s.w-bw, d: s.d, h: s.h, isFloor: s.isFloor });
    }
    if (s.h - bh > 0) {
      newSpaces.push({ x: s.x, y: s.y+bh, z: s.z, w: bw, d: s.d, h: s.h-bh, isFloor: false }); // 上方非地板
    }
    if (s.d - bd > 0) {
      newSpaces.push({ x: s.x, y: s.y, z: s.z+bd, w: bw, d: s.d-bd, h: bh, isFloor: s.isFloor });
    }
    this.spaces.splice(spaceIdx, 1);
    this.spaces.push(...newSpaces);
    this.mergeSpaces();
    return pos;
  }
}

// ==================== 混合评分算法 (贪心+LMH) ====================
function packHybrid(tw, td, th, boxes) {
  const sm = new SpaceManager(tw, td, th);
  const placed = [];
  const steps = [];

  // 展开所有箱子，按体积降序
  const items = [];
  for (let box of boxes) {
    for (let i = 0; i < box.count; i++) {
      items.push({ name: box.name, w: box.w, d: box.d, h: box.h });
    }
  }
  items.sort((a,b) => (b.w*b.d*b.h) - (a.w*a.d*a.h));

  // 逐个放置
  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    const candidates = sm.queryAllPlacements(item.w, item.d, item.h);
    if (candidates.length === 0) {
      return { success: false, placed, steps, error: `第${i+1}个箱子无法放置` };
    }

    // 混合评分：接触面积(权0.2) + 体积(权0.002) + 剩余最小维度(权1.0)
    let best = null;
    let bestScore = -Infinity;
    for (let cand of candidates) {
      const score = cand.contact * 0.2 + cand.volume * 0.002 + cand.minDim * 1.0;
      if (score > bestScore) {
        bestScore = score;
        best = cand;
      }
    }

    const pos = sm.applyPlace(best.spaceIdx, best.bw, best.bd, best.bh);
    placed.push({
      name: item.name,
      x: pos.x, y: pos.y, z: pos.z,
      w: best.bw, d: best.bd, h: best.bh
    });
    steps.push(`${item.name} 放置于 (${pos.x},${pos.y},${pos.z}) 尺寸 ${best.bw}×${best.bd}×${best.bh}${best.bh!==item.h?'(侧放)':''}`);
  }

  return { success: true, placed, steps };
}

// ==================== 截面面积验证 ====================
function verifySlices(placed, tw, th, step = 10) {
  // 沿z轴（前后方向）每隔step取一个截面，检查总截面积是否超过tw*th
  const maxZ = Math.max(...placed.map(p => p.z + p.d));
  for (let z = 0; z <= maxZ; z += step) {
    let totalArea = 0;
    for (let p of placed) {
      if (p.z <= z && p.z + p.d > z) {
        // 箱子在截面处存在，计算截面面积 (宽度*高度)
        totalArea += p.w * p.h;
      }
    }
    if (totalArea > tw * th + 0.01) {
      return { valid: false, z, totalArea, maxArea: tw * th };
    }
  }
  return { valid: true };
}

// ==================== 3D 渲染 ====================
let scene, camera, renderer, controls;
function init3D() {
  const container = document.getElementById('viewer');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a2e);
  camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 10, 3000);
  camera.position.set(600, 500, 800);
  camera.lookAt(100, 100, 200);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(120, 120, 250);
  controls.update();
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const light = new THREE.DirectionalLight(0xffffff, 0.8);
  light.position.set(300, 500, 400);
  scene.add(light);
  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });
}

function drawTruck(w, d, h) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
  const truck = new THREE.Mesh(geo, mat);
  truck.position.set(w/2, h/2, d/2);
  scene.add(truck);
}

function drawBoxes(placed) {
  const colors = ['#e94560', '#f5a623', '#43d8c9', '#6c5ce7'];
  const colorMap = {};
  let idx = 0;
  for (let item of placed) {
    if (!colorMap[item.name]) colorMap[item.name] = colors[idx++ % colors.length];
    const color = colorMap[item.name];
    const geo = new THREE.BoxGeometry(item.w, item.h, item.d);
    const mat = new THREE.MeshPhongMaterial({ color, transparent: true, opacity: 0.75 });
    const cube = new THREE.Mesh(geo, mat);
    cube.position.set(item.x + item.w/2, item.y + item.h/2, item.z + item.d/2);
    scene.add(cube);
    cube.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0xffffff })));
  }
}

function clearScene() {
  while(scene.children.length) scene.remove(scene.children[0]);
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const light = new THREE.DirectionalLight(0xffffff, 0.8);
  light.position.set(300, 500, 400);
  scene.add(light);
}

// ==================== UI ====================
function addBoxRow(name = '', w = '', d = '', h = '', cnt = '') {
  const div = document.createElement('div');
  div.className = 'box-row';
  div.innerHTML = `
    <input class="boxName" placeholder="名称" value="${name}">
    <input class="boxW" type="number" placeholder="宽" value="${w}">
    <input class="boxD" type="number" placeholder="深" value="${d}">
    <input class="boxH" type="number" placeholder="高" value="${h}">
    <input class="boxCount" type="number" placeholder="数量" value="${cnt}">
    <button class="delBox">✕</button>`;
  div.querySelector('.delBox').onclick = () => div.remove();
  document.getElementById('boxList').appendChild(div);
}

function getBoxes() {
  return Array.from(document.querySelectorAll('#boxList .box-row')).map(r => ({
    name: r.querySelector('.boxName').value,
    w: +r.querySelector('.boxW').value,
    d: +r.querySelector('.boxD').value,
    h: +r.querySelector('.boxH').value,
    count: +r.querySelector('.boxCount').value
  })).filter(b => b.w > 0 && b.d > 0 && b.h > 0 && b.count > 0);
}

async function calculate() {
  const tw = +document.getElementById('tw').value;
  const td = +document.getElementById('td').value;
  const th = +document.getElementById('th').value;
  const boxes = getBoxes();
  if (!tw || !td || !th || !boxes.length) return alert('请完整填写尺寸');

  const mode = document.getElementById('mode').value;
  let result;
  if (mode === 'hybrid') {
    result = packHybrid(tw, td, th, boxes);
  } else if (mode === 'adjacent') {
    // 相邻分布可继续使用以前版本，这里省略，可自行补全
    result = { success: false, error: '相邻分布暂未实现，请选择混合算法' };
  } else if (mode === 'space') {
    // 同样省略
    result = { success: false, error: '占空间最小暂未实现' };
  }

  if (!result.success) {
    document.getElementById('resultText').textContent = '❌ 装不下：' + (result.error || '空间不足');
    return;
  }

  // 截面验证
  const verify = verifySlices(result.placed, tw, th, 10);
  if (!verify.valid) {
    document.getElementById('resultText').textContent = `❌ 截面验证失败：在 z=${verify.z} 处总面积=${verify.totalArea} 超出 ${verify.maxArea}，存在重叠！`;
    return;
  }

  document.getElementById('resultText').textContent = 
    `✅ 成功装入 ${result.placed.length} 个箱子\n` +
    `截面验证通过：无重叠\n` +
    `填充率：${(result.placed.reduce((s,p)=>s+p.w*p.d*p.h,0) / (tw*td*th) * 100).toFixed(1)}%\n` +
    result.steps.join('\n');

  clearScene();
  drawTruck(tw, td, th);
  drawBoxes(result.placed);
}

// 默认数据
addBoxRow('纸箱A', '40', '40', '64', '50');
addBoxRow('纸箱B', '43', '43', '72', '50');
addBoxRow('纸箱C', '40', '40', '52', '100');
addBoxRow('纸箱D', '32', '32', '51', '100');

document.getElementById('addBoxBtn').onclick = () => addBoxRow();
document.getElementById('calcBtn').onclick = calculate;
init3D();
drawTruck(235, 589, 239);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>

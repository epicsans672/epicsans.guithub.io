<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>货车装箱 - LMH算法</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:system-ui, sans-serif; background:#1a1a2e; color:#eee; }
    .container { display:flex; height:100vh; }
    .panel { width:380px; background:#16213e; padding:20px; overflow-y:auto; }
    h2 { margin-bottom:15px; color:#e94560; }
    label { display:block; margin:10px 0 4px; font-size:14px; }
    input, button, select { width:100%; padding:8px; border:none; border-radius:6px; margin-bottom:8px; }
    input, select { background:#0f3460; color:#fff; }
    button { background:#e94560; color:white; font-weight:bold; cursor:pointer; }
    button:hover { background:#ff6b81; }
    .box-row { display:flex; gap:5px; align-items:center; flex-wrap:wrap; }
    .box-row input { width:65px; }
    .box-row button { width:auto; padding:6px 10px; font-size:12px; }
    #addBoxBtn { margin-top:10px; }
    .result { margin-top:15px; white-space:pre-wrap; font-size:13px; max-height:300px; overflow-y:auto; }
    #viewer { flex:1; position:relative; }
    canvas { display:block; }
  </style>
</head>
<body>
<div class="container">
  <div class="panel">
    <h2>📦 货车装箱参数</h2>
    <label>宽 (左右, cm)</label><input id="tw" type="number" value="235">
    <label>深 (前后, cm)</label><input id="td" type="number" value="589">
    <label>高 (上下, cm)</label><input id="th" type="number" value="239">
    <h3>纸箱</h3>
    <div id="boxList"></div>
    <button id="addBoxBtn">➕ 添加纸箱</button>
    <div style="margin-top:15px;">
      <label>模式</label>
      <select id="mode">
        <option value="auto">优先相邻分布</option>
        <option value="adjacent">仅相邻分布</option>
        <option value="space">占空间最小</option>
        <option value="lmh" selected>LMH 算法</option>
      </select>
    </div>
    <button id="calcBtn">🚛 开始计算</button>
    <div id="resultText" class="result"></div>
  </div>
  <div id="viewer"></div>
</div>

<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ==================== 工具 ====================
function getAllowedOrientations(w,d,h, isTopLayer) {
  const ori = [[w,d,h]];
  if (w !== d) ori.push([d,w,h]);
  if (isTopLayer) {
    const all = [[w,d,h],[d,w,h],[w,h,d],[h,w,d],[d,h,w],[h,d,w]];
    return Array.from(new Set(all.map(a=>a.join(',')))).map(s=>s.split(',').map(Number));
  }
  return ori;
}

// ==================== 空间管理器 ====================
class SpaceManager {
  constructor(tw, td, th) {
    this.spaces = [{ x:0, y:0, z:0, w:tw, d:td, h:th, isFloor:true }];
    this.th = th;
  }

  mergeSpaces() {
    let merged = true;
    while (merged) {
      merged = false;
      for (let i = 0; i < this.spaces.length; i++) {
        const a = this.spaces[i];
        for (let j = i+1; j < this.spaces.length; j++) {
          const b = this.spaces[j];
          if (a.x===b.x && a.z===b.z && a.w===b.w && a.d===b.d && a.y+a.h===b.y && a.isFloor===b.isFloor) {
            a.h += b.h; this.spaces.splice(j,1); merged=true; break;
          }
          if (a.x===b.x && a.z===b.z && a.w===b.w && a.d===b.d && b.y+b.h===a.y && a.isFloor===b.isFloor) {
            a.y = b.y; a.h += b.h; this.spaces.splice(j,1); merged=true; break;
          }
          if (a.x===b.x && a.y===b.y && a.w===b.w && a.h===b.h && a.z+a.d===b.z && a.isFloor===b.isFloor) {
            a.d += b.d; this.spaces.splice(j,1); merged=true; break;
          }
          if (a.x===b.x && a.y===b.y && a.w===b.w && a.h===b.h && b.z+b.d===a.z && a.isFloor===b.isFloor) {
            a.z = b.z; a.d += b.d; this.spaces.splice(j,1); merged=true; break;
          }
          if (a.y===b.y && a.z===b.z && a.d===b.d && a.h===b.h && a.x+a.w===b.x && a.isFloor===b.isFloor) {
            a.w += b.w; this.spaces.splice(j,1); merged=true; break;
          }
          if (a.y===b.y && a.z===b.z && a.d===b.d && a.h===b.h && b.x+b.w===a.x && a.isFloor===b.isFloor) {
            a.x = b.x; a.w += b.w; this.spaces.splice(j,1); merged=true; break;
          }
        }
        if (merged) break;
      }
    }
  }

  isTopSpace(space) {
    return Math.abs(space.y + space.h - this.th) < 0.01;
  }

  // 查询放置，返回所有可行方案列表（供 LMH 选择）
  queryAllPlacements(originalW, originalD, originalH) {
    this.mergeSpaces();
    const candidates = [];
    for (let i = 0; i < this.spaces.length; i++) {
      const s = this.spaces[i];
      if (s.isFloor && s.y > 0) continue;
      const topLayer = this.isTopSpace(s);
      const orientations = getAllowedOrientations(originalW, originalD, originalH, topLayer);
      for (let [ow, od, oh] of orientations) {
        if (ow <= s.w && od <= s.d && oh <= s.h) {
          // 计算剩余空间质量（用于 LMH）
          const spacesAfter = this._simulatePlacement(s, ow, od, oh);
          const minDim = spacesAfter.reduce((min, sp) => Math.min(min, Math.min(sp.w, sp.d, sp.h)), Infinity);
          candidates.push({ idx: i, bw:ow, bd:od, bh:oh, minDim, s });
        }
      }
    }
    return candidates;
  }

  _simulatePlacement(s, bw, bd, bh) {
    const newSpaces = [];
    if (s.w - bw > 0) newSpaces.push({ w: s.w-bw, d: s.d, h: s.h });
    if (s.h - bh > 0) newSpaces.push({ w: bw, d: s.d, h: s.h-bh });
    if (s.d - bd > 0) newSpaces.push({ w: bw, d: s.d-bd, h: bh });
    // 简单合并模拟（粗略）
    return newSpaces;
  }

  applyPlace(idx, bw, bd, bh) {
    const s = this.spaces[idx];
    const pos = { x: s.x, y: s.y, z: s.z };
    const newSpaces = [];
    if (s.w - bw > 0)
      newSpaces.push({ x: s.x+bw, y: s.y, z: s.z, w: s.w-bw, d: s.d, h: s.h, isFloor: s.isFloor });
    if (s.h - bh > 0)
      newSpaces.push({ x: s.x, y: s.y+bh, z: s.z, w: bw, d: s.d, h: s.h-bh, isFloor: false });
    if (s.d - bd > 0)
      newSpaces.push({ x: s.x, y: s.y, z: s.z+bd, w: bw, d: s.d-bd, h: bh, isFloor: s.isFloor });

    this.spaces.splice(idx, 1);
    this.spaces.push(...newSpaces);
    this.mergeSpaces();
    return pos;
  }
}

// ==================== 相邻分布 ====================
function packAdjacent(tw, td, th, boxes) {
  const sm = new SpaceManager(tw, td, th);
  const placed = []; const steps = [];
  for (let box of boxes) {
    let best = null;
    const ori = getAllowedOrientations(box.w, box.d, box.h, false);
    for (let [bw, bd, bh] of ori) {
      const maxA = Math.floor(tw/bw), maxB = Math.floor(td/bd), maxC = Math.floor(th/bh);
      if (maxA*maxB*maxC < box.count) continue;
      for (let a=1;a<=maxA;a++) for (let b=1;b<=maxB;b++) {
        const c = Math.ceil(box.count/(a*b)); if (c>maxC) continue;
        const w=a*bw, d=b*bd, h=c*bh, vol=w*d*h;
        if (!best || vol < best.vol) best = {a,b,c,bw,bd,bh,w,d,h,vol,name:box.name,count:box.count};
      }
    }
    if (!best) return {success:false,placed:[],steps:[]};
    const cands = sm.queryAllPlacements(best.bw, best.bd, best.bh);
    if (cands.length===0) return {success:false,placed:[],steps:[]};
    const chosen = cands.reduce((a,b) => a.minDim > b.minDim ? a : b); // 用LMH选择块位置
    const pos = sm.applyPlace(chosen.idx, chosen.bw, chosen.bd, chosen.bh);
    let rem = best.count;
    for (let k=0;k<best.c&&rem;k++) for (let j=0;j<best.b&&rem;j++) for (let i=0;i<best.a&&rem;i++) {
      placed.push({name:best.name, x:pos.x+i*best.bw, y:pos.y+k*best.bh, z:pos.z+j*best.bd, w:best.bw, d:best.bd, h:best.bh});
      rem--;
    }
    steps.push(`“${best.name}”块在(${pos.x},${pos.y},${pos.z})`);
  }
  return {success:true, placed, steps};
}

// ==================== 占空间最小 ====================
function packSpaceMin(tw, td, th, boxes, useLMH=false) {
  const sm = new SpaceManager(tw, td, th);
  const placed = []; const steps = [];
  const items = [];
  for (let b of boxes) for (let i=0;i<b.count;i++) items.push({name:b.name, w:b.w, d:b.d, h:b.h});
  items.sort((a,b) => (b.w*b.d*b.h) - (a.w*a.d*a.h));

  for (let i=0;i<items.length;i++) {
    const item = items[i];
    const cands = sm.queryAllPlacements(item.w, item.d, item.h);
    if (cands.length===0) return {success:false, placed, steps};
    // 选择：若是LMH则选minDim最大的，否则选体积大且接触好的（原逻辑）
    let chosen;
    if (useLMH) {
      chosen = cands.reduce((a,b) => a.minDim > b.minDim ? a : b);
    } else {
      // 原贪心：选体积*接触
      chosen = cands.reduce((a,b) => {
        const scoreA = (a.bw*a.bd*a.bh) + (a.s.z===0?a.bw*a.bh:0)+(a.s.y===0?a.bw*a.bd:0);
        const scoreB = (b.bw*b.bd*b.bh) + (b.s.z===0?b.bw*b.bh:0)+(b.s.y===0?b.bw*b.bd:0);
        return scoreA > scoreB ? a : b;
      });
    }
    const pos = sm.applyPlace(chosen.idx, chosen.bw, chosen.bd, chosen.bh);
    placed.push({name:item.name, x:pos.x, y:pos.y, z:pos.z, w:chosen.bw, d:chosen.bd, h:chosen.bh});
    steps.push(`放置 ${item.name} 于 (${pos.x},${pos.y},${pos.z}) 尺寸 ${chosen.bw}×${chosen.bd}×${chosen.bh}${chosen.bh!==item.h?'(侧放)':''}`);
  }
  return {success:true, placed, steps};
}

// ==================== 3D 渲染 ====================
let scene,camera,renderer,controls;
function init3D() {
  const c = document.getElementById('viewer');
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x1a1a2e);
  camera = new THREE.PerspectiveCamera(50, c.clientWidth/c.clientHeight, 10, 3000);
  camera.position.set(600,500,800); camera.lookAt(100,100,200);
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(c.clientWidth, c.clientHeight);
  c.appendChild(renderer.domElement);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(120,120,250); controls.update();
  scene.add(new THREE.AmbientLight(0xffffff,0.6));
  const l = new THREE.DirectionalLight(0xffffff,0.8); l.position.set(300,500,400); scene.add(l);
  window.addEventListener('resize',()=>{
    camera.aspect = c.clientWidth/c.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(c.clientWidth, c.clientHeight);
  });
}
function drawTruck(w,d,h) {
  const g = new THREE.BoxGeometry(w,h,d);
  const m = new THREE.MeshBasicMaterial({color:0x00ff00, wireframe:true});
  const t = new THREE.Mesh(g,m); t.position.set(w/2,h/2,d/2); scene.add(t);
}
function drawBoxes(placed) {
  const cols=['#e94560','#f5a623','#43d8c9','#6c5ce7'], map={}; let idx=0;
  for(let i of placed){
    if(!map[i.name]) map[i.name]=cols[idx++%cols.length];
    const g=new THREE.BoxGeometry(i.w,i.h,i.d);
    const m=new THREE.MeshPhongMaterial({color:map[i.name],transparent:true,opacity:0.75});
    const cube=new THREE.Mesh(g,m); cube.position.set(i.x+i.w/2,i.y+i.h/2,i.z+i.d/2);
    scene.add(cube);
    cube.add(new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color:0xffffff})));
  }
}
function clearScene(){
  while(scene.children.length) scene.remove(scene.children[0]);
  scene.add(new THREE.AmbientLight(0xffffff,0.6));
  const l=new THREE.DirectionalLight(0xffffff,0.8); l.position.set(300,500,400); scene.add(l);
}

// ==================== UI ====================
function addBoxRow(name='',w='',d='',h='',cnt=''){
  const div=document.createElement('div'); div.className='box-row';
  div.innerHTML=`<input class="boxName" placeholder="名称" value="${name}"><input class="boxW" type="number" placeholder="宽" value="${w}"><input class="boxD" type="number" placeholder="深" value="${d}"><input class="boxH" type="number" placeholder="高" value="${h}"><input class="boxCount" type="number" placeholder="数量" value="${cnt}"><button class="delBox">✕</button>`;
  div.querySelector('.delBox').onclick=()=>div.remove();
  document.getElementById('boxList').appendChild(div);
}
function getBoxes(){
  return Array.from(document.querySelectorAll('#boxList .box-row')).map(r=>({
    name: r.querySelector('.boxName').value,
    w: +r.querySelector('.boxW').value,
    d: +r.querySelector('.boxD').value,
    h: +r.querySelector('.boxH').value,
    count: +r.querySelector('.boxCount').value
  })).filter(b=>b.w&&b.d&&b.h&&b.count);
}

async function calculate(){
  const tw=+document.getElementById('tw').value, td=+document.getElementById('td').value, th=+document.getElementById('th').value;
  const boxes=getBoxes();
  if(!tw||!td||!th||!boxes.length) return alert('请填完整');
  const mode=document.getElementById('mode').value;
  let result;
  if(mode==='adjacent') result=packAdjacent(tw,td,th,boxes);
  else if(mode==='space') result=packSpaceMin(tw,td,th,boxes,false);
  else if(mode==='lmh') result=packSpaceMin(tw,td,th,boxes,true);
  else { // auto
    result=packAdjacent(tw,td,th,boxes);
    if(!result.success) result=packSpaceMin(tw,td,th,boxes,true);
  }
  if(!result.success) { document.getElementById('resultText').textContent='❌ 装不下'; return; }
  document.getElementById('resultText').textContent=`✅ 装入 ${result.placed.length} 箱\n`+result.steps.join('\n');
  clearScene(); drawTruck(tw,td,th); drawBoxes(result.placed);
}

// 默认数据
addBoxRow('纸箱A','40','40','64','50');
addBoxRow('纸箱B','43','43','72','50');
addBoxRow('纸箱C','40','40','52','100');
addBoxRow('纸箱D','32','32','51','100');

document.getElementById('addBoxBtn').onclick=()=>addBoxRow();
document.getElementById('calcBtn').onclick=calculate;
init3D(); drawTruck(235,589,239);
function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
animate();
</script>
</body>
</html>

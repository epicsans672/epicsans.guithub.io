<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>货车装箱 - 分层天际线 + 顶部填充</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:system-ui, sans-serif; background:#1a1a2e; color:#eee; }
    .container { display:flex; height:100vh; }
    .panel { width:380px; background:#16213e; padding:20px; overflow-y:auto; }
    h2 { margin-bottom:15px; color:#e94560; }
    label { display:block; margin:10px 0 4px; font-size:14px; }
    input, button, select { width:100%; padding:8px; border:none; border-radius:6px; margin-bottom:8px; }
    input, select { background:#0f3460; color:#fff; }
    button { background:#e94560; color:white; font-weight:bold; cursor:pointer; }
    button:disabled { background:#555; cursor:not-allowed; }
    .box-row { display:flex; gap:5px; align-items:center; flex-wrap:wrap; }
    .box-row input { width:65px; }
    .box-row button { width:auto; padding:6px 10px; font-size:12px; }
    #addBoxBtn { margin-top:10px; }
    .result { margin-top:15px; white-space:pre-wrap; font-size:13px; max-height:300px; overflow-y:auto; }
    #viewer { flex:1; position:relative; }
    canvas { display:block; }
  </style>
</head>
<body>
<div class="container">
  <div class="panel">
    <h2>📦 货车装箱参数</h2>
    <label>宽 (左右, cm)</label><input id="tw" type="number" value="235">
    <label>深 (前后, cm)</label><input id="td" type="number" value="589">
    <label>高 (上下, cm)</label><input id="th" type="number" value="239">
    <h3>纸箱</h3>
    <div id="boxList"></div>
    <button id="addBoxBtn">➕ 添加纸箱</button>
    <div style="margin-top:15px;">
      <label>算法</label>
      <select id="mode">
        <option value="skyline" selected>分层天际线 + 顶部填充</option>
        <option value="skyline-fast">单次模式</option>
      </select>
    </div>
    <button id="calcBtn">🚛 开始计算</button>
    <div id="resultText" class="result"></div>
  </div>
  <div id="viewer"></div>
</div>

<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// =============== 方向 ===============
function getOrientations(w,d,h, canTilt) {
  const ori = [[w,d,h]];
  if (w !== d) ori.push([d,w,h]);
  if (canTilt) {
    const all = [[w,d,h],[d,w,h],[w,h,d],[h,w,d],[d,h,w],[h,d,w]];
    return Array.from(new Set(all.map(a=>a.join(',')))).map(s=>s.split(',').map(Number));
  }
  return ori;
}

// =============== 二维天际线 ===============
class Skyline2D {
  constructor(W, H) {
    this.W = W; this.H = H;
    this.lines = [{ x:0, y:0 }];
  }

  tryPlace(w, h) {
    let bestX = -1, bestY = Infinity;
    for (let i = 0; i < this.lines.length; i++) {
      const line = this.lines[i];
      let y = line.y;
      let j = i, remainingW = w, maxY = y;
      while (remainingW > 0 && j < this.lines.length) {
        const nextLine = this.lines[j];
        const widthAvail = (j < this.lines.length - 1 ? this.lines[j+1].x - nextLine.x : this.W - nextLine.x);
        const useW = Math.min(widthAvail, remainingW);
        maxY = Math.max(maxY, nextLine.y);
        remainingW -= useW;
        if (remainingW > 0) j++;
      }
      if (remainingW === 0 && maxY + h <= this.H && y < bestY) {
        bestY = y;
        bestX = line.x;
      }
    }
    if (bestX === -1) return null;
    this._updateSkyline(bestX, w, bestY + h);
    return { x: bestX, y: bestY };
  }

  _updateSkyline(x, w, newY) {
    const newLines = [];
    let i = 0;
    while (i < this.lines.length && this.lines[i].x < x) {
      newLines.push({...this.lines[i]}); i++;
    }
    newLines.push({ x, y: newY });
    while (i < this.lines.length && this.lines[i].x < x + w) i++;
    if (i < this.lines.length) {
      const right = this.lines[i];
      if (right.x > x + w) newLines.push({ x: x + w, y: this._getYAt(x + w) });
      while (i < this.lines.length) newLines.push({...this.lines[i]}); i++;
    } else if (x + w < this.W) {
      newLines.push({ x: x + w, y: 0 });
    }
    this.lines = [];
    for (let seg of newLines) {
      if (this.lines.length > 0 && this.lines[this.lines.length-1].y === seg.y) {
        // 合并
      } else {
        this.lines.push(seg);
      }
    }
  }

  _getYAt(x) {
    for (let i = this.lines.length-1; i >= 0; i--) {
      if (this.lines[i].x <= x) return this.lines[i].y;
    }
    return 0;
  }
}

// =============== 分层装箱 ===============
function layerPack(tw, td, th, items, canTiltTop = true) {
  const placed = [];
  const steps = [];
  let z = 0;
  const sorted = [...items].sort((a,b) => (b.w*b.d*b.h) - (a.w*a.d*a.h));
  let remaining = [...sorted];

  while (remaining.length > 0 && z < td) {
    let layerDepth = null;
    for (let i = 0; i < remaining.length; i++) {
      const item = remaining[i];
      const oris = getOrientations(item.w, item.d, item.h, false);
      for (let [ow, od, oh] of oris) {
        if (z + od <= td && oh <= th) { layerDepth = od; break; }
      }
      if (layerDepth) break;
    }
    if (!layerDepth) { z += 1; continue; }

    const candidates = [];
    for (let i = remaining.length-1; i >= 0; i--) {
      const item = remaining[i];
      const oris = getOrientations(item.w, item.d, item.h, false);
      let found = false;
      for (let [ow, od, oh] of oris) {
        if (od === layerDepth && oh <= th) {
          candidates.push({ item, ow, od, oh });
          remaining.splice(i, 1);
          found = true;
          break;
        }
      }
      if (!found) {
        // 尝试其他深度？直接跳过
      }
    }
    if (candidates.length === 0) { z += layerDepth; continue; }

    const sky2d = new Skyline2D(tw, th);
    for (let cand of candidates) {
      const { ow, oh, item } = cand;
      const pos = sky2d.tryPlace(ow, oh);
      if (pos) {
        placed.push({ name: item.name, x: pos.x, y: pos.y, z: z, w: ow, d: layerDepth, h: oh });
        steps.push(`${item.name} 于 (${pos.x},${pos.y},${z}) 尺寸 ${ow}×${layerDepth}×${oh}`);
      } else {
        remaining.push(item); // 放回去
      }
    }
    z += layerDepth;
  }

  // 最后尝试允许侧放填充剩余
  if (remaining.length > 0 && z < td) {
    const sky2d = new Skyline2D(tw, th);
    for (let item of [...remaining]) {
      const oris = getOrientations(item.w, item.d, item.h, true);
      let placedFlag = false;
      for (let [ow, od, oh] of oris) {
        if (z + od <= td && oh <= th) {
          const pos = sky2d.tryPlace(ow, oh);
          if (pos) {
            placed.push({ name: item.name, x: pos.x, y: pos.y, z: z, w: ow, d: od, h: oh });
            steps.push(`${item.name} 于 (${pos.x},${pos.y},${z}) 尺寸 ${ow}×${od}×${oh} (侧放)`);
            remaining.splice(remaining.indexOf(item), 1);
            placedFlag = true;
            break;
          }
        }
      }
    }
  }

  return { success: placed.length === items.length, placed, steps, remaining };
}

// =============== 顶部空隙填充 ===============
function fillTopGaps(tw, td, th, placed, remainingItems) {
  // 按底面积升序排序（小箱子优先）
  const sortedRemaining = [...remainingItems].sort((a,b) => (a.w*a.d) - (b.w*b.d));
  let updatedPlaced = [...placed];
  let updatedSteps = [];
  let changed = true;
  
  while (changed) {
    changed = false;
    for (let i = sortedRemaining.length-1; i >= 0; i--) {
      const item = sortedRemaining[i];
      const oris = getOrientations(item.w, item.d, item.h, true);
      let bestPlacement = null;
      for (let [ow, od, oh] of oris) {
        // 寻找一个已放置箱子，其顶面可以完全承载该箱子
        for (let p of updatedPlaced) {
          if (p.y + p.h + oh > th) continue; // 超出高度
          if (ow > p.w || od > p.d) continue; // 底面积必须小于等于下方箱子
          // 支撑范围：上方箱子底面必须完全在下方程子顶面内
          const x1 = p.x, x2 = p.x + p.w;
          const z1 = p.z, z2 = p.z + p.d;
          // 尝试将上方箱子放在下方程子的某个角落（这里简化为左下角对齐）
          const testPos = { x: p.x, y: p.y + p.h, z: p.z };
          // 检查是否完全在下方程子范围内
          if (testPos.x + ow > x2 || testPos.z + od > z2) continue;
          // 检查是否与其他已放置箱子重叠（除了下方这个）
          let overlap = false;
          for (let q of updatedPlaced) {
            if (q === p) continue;
            if (!(testPos.x + ow <= q.x || testPos.x >= q.x + q.w ||
                  testPos.z + od <= q.z || testPos.z >= q.z + q.d ||
                  testPos.y + oh <= q.y || testPos.y >= q.y + q.h)) {
              overlap = true; break;
            }
          }
          if (!overlap) {
            bestPlacement = { ow, od, oh, pos: testPos };
            break;
          }
        }
        if (bestPlacement) break;
      }
      if (bestPlacement) {
        const { ow, od, oh, pos } = bestPlacement;
        updatedPlaced.push({
          name: item.name,
          x: pos.x, y: pos.y, z: pos.z,
          w: ow, d: od, h: oh
        });
        updatedSteps.push(`${item.name} 填充到顶部 (${pos.x},${pos.y},${pos.z}) 尺寸 ${ow}×${od}×${oh} (侧放)`);
        sortedRemaining.splice(i, 1);
        changed = true;
        break; // 重新开始扫描
      }
    }
  }
  
  return { placed: updatedPlaced, steps: updatedSteps, remaining: sortedRemaining };
}

// =============== 多次随机 ===============
function packMultiple(tw, td, th, baseItems, trials = 5) {
  let best = { success: false, placed: [], steps: [], remaining: baseItems };
  for (let t = 0; t < trials; t++) {
    const shuffled = [...baseItems].sort((a,b) => (b.w*b.d*b.h) - (a.w*a.d*a.h));
    for (let i = shuffled.length-1; i>0; i--) {
      if (Math.random() < 0.5) {
        const j = Math.floor(Math.random() * (i+1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
    }
    const res = layerPack(tw, td, th, shuffled);
    if (res.success) return { ...res, remaining: [] };
    if (res.placed.length > best.placed.length) best = res;
  }
  return best;
}

// =============== 3D 渲染 ===============
let scene, camera, renderer, controls;
function init3D() {
  const container = document.getElementById('viewer');
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x1a1a2e);
  camera = new THREE.PerspectiveCamera(50, container.clientWidth/container.clientHeight, 10, 3000);
  camera.position.set(600, 500, 800); camera.lookAt(100, 100, 200);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(120, 120, 250); controls.update();
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const light = new THREE.DirectionalLight(0xffffff, 0.8); light.position.set(300, 500, 400); scene.add(light);
  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });
}
function drawTruck(w,d,h) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
  const truck = new THREE.Mesh(geo, mat); truck.position.set(w/2, h/2, d/2); scene.add(truck);
}
function drawBoxes(placed) {
  const colors = ['#e94560','#f5a623','#43d8c9','#6c5ce7'], map = {}; let idx=0;
  for (let item of placed) {
    if (!map[item.name]) map[item.name] = colors[idx++ % colors.length];
    const geo = new THREE.BoxGeometry(item.w, item.h, item.d);
    const mat = new THREE.MeshPhongMaterial({ color: map[item.name], transparent: true, opacity: 0.75 });
    const cube = new THREE.Mesh(geo, mat);
    cube.position.set(item.x+item.w/2, item.y+item.h/2, item.z+item.d/2);
    scene.add(cube);
    cube.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0xffffff })));
  }
}
function clearScene() {
  while(scene.children.length) scene.remove(scene.children[0]);
  scene.add(new THREE.AmbientLight(0xffffff,0.6));
  const l = new THREE.DirectionalLight(0xffffff,0.8); l.position.set(300,500,400); scene.add(l);
}

// =============== UI ===============
function addBoxRow(name='',w='',d='',h='',cnt=''){
  const div = document.createElement('div'); div.className='box-row';
  div.innerHTML = `<input class="boxName" placeholder="名称" value="${name}"><input class="boxW" type="number" placeholder="宽" value="${w}"><input class="boxD" type="number" placeholder="深" value="${d}"><input class="boxH" type="number" placeholder="高" value="${h}"><input class="boxCount" type="number" placeholder="数量" value="${cnt}"><button class="delBox">✕</button>`;
  div.querySelector('.delBox').onclick = ()=>div.remove();
  document.getElementById('boxList').appendChild(div);
}
function getBoxes() {
  return Array.from(document.querySelectorAll('#boxList .box-row')).map(r => ({
    name: r.querySelector('.boxName').value,
    w: +r.querySelector('.boxW').value,
    d: +r.querySelector('.boxD').value,
    h: +r.querySelector('.boxH').value,
    count: +r.querySelector('.boxCount').value
  })).filter(b => b.w>0 && b.d>0 && b.h>0 && b.count>0);
}

// =============== 计算（异步 + 顶部填充） ===============
async function calculate() {
  const tw = +document.getElementById('tw').value;
  const td = +document.getElementById('td').value;
  const th = +document.getElementById('th').value;
  const boxes = getBoxes();
  if (!tw||!td||!th||!boxes.length) return alert('请填完整');
  const mode = document.getElementById('mode').value;
  const calcBtn = document.getElementById('calcBtn');
  const resultDiv = document.getElementById('resultText');
  calcBtn.disabled = true;
  calcBtn.textContent = '⏳ 计算中…';
  resultDiv.textContent = '正在计算，请稍候…';

  const baseItems = [];
  for (let box of boxes) {
    for (let i = 0; i < box.count; i++) {
      baseItems.push({ name: box.name, w: box.w, d: box.d, h: box.h });
    }
  }

  setTimeout(() => {
    const startTime = performance.now();
    let result;
    if (mode === 'skyline') {
      result = packMultiple(tw, td, th, baseItems, 5);
    } else {
      const items = [...baseItems].sort((a,b) => (b.w*b.d*b.h) - (a.w*a.d*a.h));
      result = layerPack(tw, td, th, items);
    }

    // 顶部空隙填充（如果有剩余未放置的箱子）
    if (!result.success && result.remaining && result.remaining.length > 0) {
      const fillResult = fillTopGaps(tw, td, th, result.placed, result.remaining);
      result.placed = fillResult.placed;
      result.steps.push(...fillResult.steps);
      result.remaining = fillResult.remaining;
      result.success = fillResult.remaining.length === 0;
    }

    const elapsed = ((performance.now() - startTime)/1000).toFixed(2);
    const totalItems = baseItems.length;
    const placedCount = result.placed.length;

    if (!result.success) {
      resultDiv.textContent = `❌ 未装下全部箱子 (${placedCount}/${totalItems})，耗时${elapsed}s`;
    } else {
      const fillRate = (result.placed.reduce((s,p)=>s+p.w*p.d*p.h,0) / (tw*td*th) * 100).toFixed(1);
      resultDiv.textContent = `✅ 全部装入 ${placedCount} 箱 耗时${elapsed}s\n填充率: ${fillRate}%\n` + result.steps.join('\n');
    }
    clearScene();
    drawTruck(tw,td,th);
    drawBoxes(result.placed);
    calcBtn.disabled = false;
    calcBtn.textContent = '🚛 开始计算';
  }, 20);
}

// 默认数据
addBoxRow('纸箱A','40','40','64','50');
addBoxRow('纸箱B','43','43','72','50');
addBoxRow('纸箱C','40','40','52','100');
addBoxRow('纸箱D','32','32','51','100');

document.getElementById('addBoxBtn').onclick = ()=>addBoxRow();
document.getElementById('calcBtn').onclick = calculate;
init3D(); drawTruck(235,589,239);

function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
animate();
</script>
</body>
</html>

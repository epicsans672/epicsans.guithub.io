<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能装箱计算器 + 3D 示意图</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            box-sizing: border-box;
        }
        .box-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        .box-row input { width: 80px; }
        button {
            padding: 10px 20px;
            margin: 15px 5px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 6px;
            border: none;
        }
        .btn-calc { background: #059669; color: white; }
        .btn-ai { background: #4f46e5; color: white; }
        .btn-add { background: #2563eb; color: white; }
        .btn-animate { background: #d97706; color: white; }
        .btn-reset { background: #6b7280; color: white; }
        #result {
            white-space: pre-wrap;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            line-height: 1.6;
            min-height: 80px;
            max-height: 300px;
            overflow-y: auto;
        }
        .flex-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .result-panel { flex: 1; }
        .viewer-panel { flex: 1; }
        #3d-container {
            width: 100%;
            height: 500px;
            background: #1a1a2e;
            border-radius: 8px;
            position: relative;
        }
        .loading {
            color: #d97706;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>📦 智能装箱计算器（3D 版）</h1>
    <p>输入卡车内部尺寸和纸箱清单，后端计算后下方会显示 3D 摆放图。</p>

    <h2>卡车内部尺寸 (cm)</h2>
    <label>长 <input type="number" id="truckL" value="589" min="1"></label>
    <label>宽 <input type="number" id="truckW" value="235" min="1"></label>
    <label>高 <input type="number" id="truckH" value="239" min="1"></label>

    <h2>纸箱清单</h2>
    <div id="boxList">
        <div class="box-row">
            <span>📦 1</span>
            <input type="number" placeholder="长cm" class="boxL" value="40">
            <input type="number" placeholder="宽cm" class="boxW" value="40">
            <input type="number" placeholder="高cm" class="boxH" value="64">
            <input type="number" placeholder="数量" class="boxQty" value="50" min="1">
        </div>
        <div class="box-row">
            <span>📦 2</span>
            <input type="number" placeholder="长cm" class="boxL" value="43">
            <input type="number" placeholder="宽cm" class="boxW" value="43">
            <input type="number" placeholder="高cm" class="boxH" value="72">
            <input type="number" placeholder="数量" class="boxQty" value="50" min="1">
        </div>
        <div class="box-row">
            <span>📦 3</span>
            <input type="number" placeholder="长cm" class="boxL" value="40">
            <input type="number" placeholder="宽cm" class="boxW" value="40">
            <input type="number" placeholder="高cm" class="boxH" value="52">
            <input type="number" placeholder="数量" class="boxQty" value="100" min="1">
        </div>
        <div class="box-row">
            <span>📦 4</span>
            <input type="number" placeholder="长cm" class="boxL" value="32">
            <input type="number" placeholder="宽cm" class="boxW" value="32">
            <input type="number" placeholder="高cm" class="boxH" value="51">
            <input type="number" placeholder="数量" class="boxQty" value="100" min="1">
        </div>
    </div>
    <button class="btn-add" onclick="addBoxRow()">➕ 添加纸箱类型</button>

    <h2>摆放模式</h2>
    <select id="mode">
        <option value="grouped">🧱 优先同种纸箱相邻分布 (集中堆放)</option>
        <option value="compact">🧩 优先最小空间占用 (允许混合放置)</option>
    </select>

    <button class="btn-calc" onclick="calculate()">⚡ 开始计算 (后端)</button>
    <button class="btn-ai" onclick="askDeepSeek()">🤖 咨询 DeepSeek</button>

    <div class="flex-container">
        <div class="result-panel">
            <h2>📋 摆放说明</h2>
            <div id="result">等待计算……</div>
        </div>
        <div class="viewer-panel">
            <h2>🖼️ 3D 示意图</h2>
            <div id="3d-container"></div>
            <div style="margin-top: 10px;">
                <button class="btn-animate" id="btnAnimate" onclick="startAnimation()" disabled>▶️ 逐个放置箱子</button>
                <button class="btn-reset" onclick="reset3DView()">🔄 重置视角</button>
            </div>
        </div>
    </div>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ---------- 全局 3D 变量 ----------
        let scene, camera, renderer, controls;
        let truckGroup, boxesGroup;
        let boxMeshes = [];          // 存储所有箱子的 Mesh
        let animationQueue = [];     // 待动画显示的箱子索引列表
        let isAnimating = false;
        let animationId = null;

        // 颜色表（不同箱子类型用不同颜色）
        const colorPalette = [
            0xe63946, 0xf4a261, 0x2a9d8f, 0x264653,
            0xa8dadc, 0x457b9d, 0xffb703, 0xfb8500,
            0x8338ec, 0x3a86ff, 0xff006e, 0xfb5607
        ];

        // 获取当前页面中输入的卡车尺寸（用于 3D 卡车轮廓）
        function getTruckDims() {
            const l = +document.getElementById('truckL').value;
            const w = +document.getElementById('truckW').value;
            const h = +document.getElementById('truckH').value;
            return { l, w, h };
        }

        // 初始化 Three.js 场景
        function initThreeJS() {
            const container = document.getElementById('3d-container');
            if (!container) return;

            // 清空容器（避免重复初始化）
            container.innerHTML = '';

            // 场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.Fog(0x1a1a2e, 500, 2000);

            // 相机
            const aspect = container.clientWidth / container.clientHeight;
            camera = new THREE.PerspectiveCamera(45, aspect, 10, 5000);
            camera.position.set(600, 400, 600);
            camera.lookAt(0, 0, 0);

            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 控制器
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 0, 0);
            controls.update();

            // 灯光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(500, 800, 300);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            dirLight.shadow.camera.near = 50;
            dirLight.shadow.camera.far = 3000;
            dirLight.shadow.camera.left = -800;
            dirLight.shadow.camera.right = 800;
            dirLight.shadow.camera.top = 800;
            dirLight.shadow.camera.bottom = -800;
            scene.add(dirLight);

            // 地面网格（辅助参考）
            const gridHelper = new THREE.GridHelper(800, 40, 0x444466, 0x222244);
            scene.add(gridHelper);

            // 卡车轮廓组
            truckGroup = new THREE.Group();
            scene.add(truckGroup);

            // 所有箱子的组
            boxesGroup = new THREE.Group();
            scene.add(boxesGroup);

            // 绘制卡车轮廓
            drawTruckOutline();

            // 动画循环
            function animate() {
                animationId = requestAnimationFrame(animate);
                controls.update();

                // 处理箱子下落动画
                updateBoxAnimations();

                renderer.render(scene, camera);
            }
            animate();

            // 窗口大小变化自适应
            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            const container = document.getElementById('3d-container');
            if (!container || !camera || !renderer) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        // 绘制卡车半透明线框
        function drawTruckOutline() {
            // 清除旧轮廓
            while (truckGroup.children.length > 0) {
                truckGroup.remove(truckGroup.children[0]);
            }

            const { l, w, h } = getTruckDims();
            const geometry = new THREE.BoxGeometry(l, h, w); // 注意：Three.js 中 Y 轴向上，对应高度
            const edges = new THREE.EdgesGeometry(geometry);
            const wireframe = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 1 }));
            wireframe.position.set(0, h / 2, 0); // 将卡车底部放在 y=0，中心高度为 h/2
            truckGroup.add(wireframe);

            // 半透明填充面（可选）
            const transparentMat = new THREE.MeshPhongMaterial({ color: 0x00ffff, transparent: true, opacity: 0.05, side: THREE.DoubleSide });
            const boxMesh = new THREE.Mesh(geometry, transparentMat);
            boxMesh.position.copy(wireframe.position);
            truckGroup.add(boxMesh);

            // 调整相机目标到卡车中心
            controls.target.set(0, h / 2, 0);
            controls.update();
        }

        // 将后端返回的 placement 数据转换为 Three.js 坐标
        // 后端坐标: (x, y, z) = (长方向, 宽方向, 高方向)
        // Three.js: X轴→长, Y轴→高, Z轴→宽
        function toThreeCoords(p) {
            const { l: truckL, w: truckW } = getTruckDims();
            const boxL = p.l;
            const boxW = p.w; // 原宽
            const boxH = p.h; // 原高
            const px = p.x + boxL / 2 - truckL / 2;
            const py = p.z + boxH / 2;  // p.z 是离地高度，BoxGeometry 中心在高度一半处
            const pz = p.y + boxW / 2 - truckW / 2;
            return { x: px, y: py, z: pz, l: boxL, w: boxW, h: boxH };
        }

        // 根据 placements 重建箱子网格（先全部创建但隐藏，用于后续逐个显示）
        function buildBoxMeshes(placements) {
            // 清除旧箱子
            while (boxesGroup.children.length > 0) {
                boxesGroup.remove(boxesGroup.children[0]);
            }
            boxMeshes = [];

            placements.forEach((p, idx) => {
                const { x, y, z, l, w, h } = toThreeCoords(p);
                const geometry = new THREE.BoxGeometry(l, h, w); // 注意参数顺序：长、高、宽
                const color = colorPalette[(p.typeId - 1) % colorPalette.length];
                const material = new THREE.MeshPhongMaterial({ color: color, specular: 0x111111, shininess: 30 });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.castShadow = true;
                mesh.receiveShadow = true;

                // 存储目标位置和箱子信息
                mesh.userData = {
                    targetPos: new THREE.Vector3(x, y, z),
                    startPos: new THREE.Vector3(x, y + getTruckDims().h + 50, z), // 起始位置在卡车上方
                    typeId: p.typeId,
                    index: idx,
                    animProgress: 0,  // 0~1，0=起始，1=目标
                    animSpeed: 0.02 + Math.random() * 0.03 // 随机下落速度
                };

                // 初始设为不可见（位置先放在起始点）
                mesh.position.copy(mesh.userData.startPos);
                mesh.visible = false;
                boxesGroup.add(mesh);
                boxMeshes.push(mesh);
            });
        }

        // 更新箱子动画（由 animate 循环调用）
        function updateBoxAnimations() {
            if (!isAnimating) return;
            let allDone = true;
            boxMeshes.forEach(mesh => {
                if (!mesh.visible) return;
                const ud = mesh.userData;
                if (ud.animProgress < 1.0) {
                    ud.animProgress += ud.animSpeed;
                    if (ud.animProgress >= 1.0) {
                        ud.animProgress = 1.0;
                        mesh.position.copy(ud.targetPos);
                    } else {
                        // 线性插值
                        mesh.position.lerpVectors(ud.startPos, ud.targetPos, ud.animProgress);
                    }
                    allDone = false;
                }
            });
            if (allDone) {
                isAnimating = false;
                document.getElementById('btnAnimate').disabled = true;
            }
        }

        // 开始逐个放置动画
        window.startAnimation = function() {
            if (boxMeshes.length === 0) return;
            // 重置所有箱子为不可见，放到起始位置
            boxMeshes.forEach(mesh => {
                mesh.visible = false;
                mesh.position.copy(mesh.userData.startPos);
                mesh.userData.animProgress = 0;
            });
            isAnimating = true;
            document.getElementById('btnAnimate').disabled = true;

            // 每隔 300ms 显示一个箱子
            let index = 0;
            const interval = setInterval(() => {
                if (index >= boxMeshes.length) {
                    clearInterval(interval);
                    return;
                }
                const mesh = boxMeshes[index];
                mesh.visible = true;
                mesh.userData.animProgress = 0;
                mesh.position.copy(mesh.userData.startPos);
                index++;
            }, 300);
        };

        // 重置视角
        window.reset3DView = function() {
            const { h } = getTruckDims();
            camera.position.set(600, h / 2 + 300, 600);
            controls.target.set(0, h / 2, 0);
            controls.update();
        };

        // 页面加载时初始化 3D
        initThreeJS();

        // 把几个函数暴露到全局作用域，供按钮 onclick 使用
        window.buildBoxMeshes = buildBoxMeshes;
        window.getTruckDims = getTruckDims;
    </script>

    <!-- 原有的业务逻辑（非模块部分） -->
    <script>
        // ========== 请替换为你自己的 Vercel 云函数地址 ==========
        const API_URL = 'https://packing-api-chi.vercel.app/api/calculate';

        let lastResultText = '';
        let lastPlacements = [];

        function addBoxRow() {
            const list = document.getElementById('boxList');
            const idx = list.children.length + 1;
            const div = document.createElement('div');
            div.className = 'box-row';
            div.innerHTML = `
                <span>📦 ${idx}</span>
                <input type="number" placeholder="长cm" class="boxL" value="40">
                <input type="number" placeholder="宽cm" class="boxW" value="30">
                <input type="number" placeholder="高cm" class="boxH" value="20">
                <input type="number" placeholder="数量" class="boxQty" value="30" min="1">
            `;
            list.appendChild(div);
        }

        async function calculate() {
            const truckL = +document.getElementById('truckL').value;
            const truckW = +document.getElementById('truckW').value;
            const truckH = +document.getElementById('truckH').value;
            const mode = document.getElementById('mode').value;

            const boxRows = document.querySelectorAll('#boxList .box-row');
            const boxes = [];
            boxRows.forEach((row, index) => {
                const l = +row.querySelector('.boxL').value;
                const w = +row.querySelector('.boxW').value;
                const h = +row.querySelector('.boxH').value;
                const qty = +row.querySelector('.boxQty').value;
                if (l > 0 && w > 0 && h > 0 && qty > 0) {
                    boxes.push({ id: index + 1, l, w, h, qty });
                }
            });

            if (boxes.length === 0) {
                document.getElementById('result').innerHTML = '<span style="color:red;">❌ 请至少添加一种纸箱。</span>';
                return;
            }

            document.getElementById('result').innerHTML = '<span class="loading">⏳ 正在通过服务器计算，请稍候……</span>';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        truck: { l: truckL, w: truckW, h: truckH },
                        boxes: boxes,
                        mode: mode
                    })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error || `服务器错误 (状态码 ${response.status})`);
                }

                const data = await response.json();
                lastResultText = data.description;
                lastPlacements = data.placements || [];
                document.getElementById('result').textContent = data.description;

                // 更新 3D 场景
                // 重新绘制卡车轮廓（可能尺寸变了）
                if (window.getTruckDims) window.dispatchEvent(new Event('resize')); // 触发轮廓重绘（简单处理）
                // 其实可以直接调用 drawTruckOutline，但它在模块内。我们可以通过事件触发。
                // 简单方法：重新初始化整个 3D 场景（会清空）
                // 为了保持简单，我们重新初始化 3D
                const container = document.getElementById('3d-container');
                if (container) {
                    // 销毁旧场景
                    if (window.boxesGroup) {
                        // 清理逻辑可以在模块内提供一个函数，但这里用全局重新初始化
                        location.reload(); // 简单粗暴，但会丢失输入。不推荐。
                        // 更好的做法：在模块内暴露一个函数 updatePlacements，这里调用。
                    }
                }
                // 由于模块作用域限制，这里我们换个方式：直接在 HTML 里重新触发 3D 构建。
                // 我们将在后面修改代码，把 buildBoxMeshes 暴露为全局函数。
                // 现在调用全局函数（如果存在）
                if (typeof window.buildBoxMeshes === 'function') {
                    window.buildBoxMeshes(lastPlacements);
                    document.getElementById('btnAnimate').disabled = false;
                }

            } catch (error) {
                document.getElementById('result').innerHTML = `<span style="color:red;">❌ 计算失败：${error.message}</span>`;
                console.error(error);
            }
        }

        function askDeepSeek() {
            if (!lastResultText || lastResultText.trim() === '') {
                alert('请先计算装箱方案，再咨询 AI。');
                return;
            }
            const question = `我使用了一个装箱计算器，得到了以下摆放结果。\n请帮我分析这个方案是否合理，有没有优化空间，以及如何进一步减少空隙。\n\n【计算结果】\n${lastResultText}`;
            navigator.clipboard.writeText(question).then(() => {
                alert('✅ 提问内容已复制！即将打开 DeepSeek，请在对话框中粘贴（Ctrl+V）并发送。');
            }).catch(() => {
                alert('复制失败，请手动复制页面上的计算结果。');
            });
            window.open('https://chat.deepseek.com/', '_blank');
        }
    </script>
</body>
</html>

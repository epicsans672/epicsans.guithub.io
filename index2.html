<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能装箱计算器 3D 版</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; margin: 5px 0; box-sizing: border-box; }
        .box-row { display: flex; gap: 10px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
        .box-row input { width: 80px; }
        button { padding: 10px 20px; margin: 15px 5px; font-size: 16px; cursor: pointer; border-radius: 6px; border: none; }
        .btn-calc { background: #059669; color: white; }
        .btn-ai { background: #4f46e5; color: white; }
        .btn-add { background: #2563eb; color: white; }
        .btn-animate { background: #d97706; color: white; }
        .btn-reset { background: #6b7280; color: white; }
        #result { white-space: pre-wrap; background: #f5f5f5; padding: 15px; border-radius: 8px; line-height: 1.6; min-height: 80px; max-height: 300px; overflow-y: auto; }
        .flex-container { display: flex; gap: 20px; margin-top: 20px; }
        .result-panel { flex: 1; }
        .viewer-panel { flex: 1; }
        #3d-container { width: 100%; height: 500px; background: #1a1a2e; border-radius: 8px; }
        .loading { color: #d97706; font-weight: bold; }
    </style>
</head>
<body>
    <h1>📦 智能装箱计算器（3D 版）</h1>
    <p>输入卡车内部尺寸和纸箱清单，后端计算后下方会显示 3D 摆放图。</p>

    <h2>卡车内部尺寸 (cm)</h2>
    <label>长 <input type="number" id="truckL" value="589" min="1"></label>
    <label>宽 <input type="number" id="truckW" value="235" min="1"></label>
    <label>高 <input type="number" id="truckH" value="239" min="1"></label>

    <h2>纸箱清单</h2>
    <div id="boxList">
        <div class="box-row">
            <span>📦 1</span>
            <input type="number" placeholder="长cm" class="boxL" value="40">
            <input type="number" placeholder="宽cm" class="boxW" value="40">
            <input type="number" placeholder="高cm" class="boxH" value="64">
            <input type="number" placeholder="数量" class="boxQty" value="50" min="1">
        </div>
        <div class="box-row">
            <span>📦 2</span>
            <input type="number" placeholder="长cm" class="boxL" value="43">
            <input type="number" placeholder="宽cm" class="boxW" value="43">
            <input type="number" placeholder="高cm" class="boxH" value="72">
            <input type="number" placeholder="数量" class="boxQty" value="50" min="1">
        </div>
        <div class="box-row">
            <span>📦 3</span>
            <input type="number" placeholder="长cm" class="boxL" value="40">
            <input type="number" placeholder="宽cm" class="boxW" value="40">
            <input type="number" placeholder="高cm" class="boxH" value="52">
            <input type="number" placeholder="数量" class="boxQty" value="100" min="1">
        </div>
        <div class="box-row">
            <span>📦 4</span>
            <input type="number" placeholder="长cm" class="boxL" value="32">
            <input type="number" placeholder="宽cm" class="boxW" value="32">
            <input type="number" placeholder="高cm" class="boxH" value="51">
            <input type="number" placeholder="数量" class="boxQty" value="100" min="1">
        </div>
    </div>
    <button class="btn-add" onclick="addBoxRow()">➕ 添加纸箱类型</button>

    <h2>摆放模式</h2>
    <select id="mode">
        <option value="grouped">🧱 优先同种纸箱相邻分布 (集中堆放)</option>
        <option value="compact">🧩 优先最小空间占用 (允许混合放置)</option>
    </select>

    <button class="btn-calc" onclick="calculate()">⚡ 开始计算 (后端)</button>
    <button class="btn-ai" onclick="askDeepSeek()">🤖 咨询 DeepSeek</button>

    <div class="flex-container">
        <div class="result-panel">
            <h2>📋 摆放说明</h2>
            <div id="result">等待计算……</div>
        </div>
        <div class="viewer-panel">
            <h2>🖼️ 3D 示意图</h2>
            <div id="3d-container"></div>
            <div style="margin-top: 10px;">
                <button class="btn-animate" id="btnAnimate" onclick="startAnimation()" disabled>▶️ 逐个放置箱子</button>
                <button class="btn-reset" onclick="reset3DView()">🔄 重置视角</button>
            </div>
        </div>
    </div>

    <!-- 传统 CDN，兼容性最好 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // ⚠️ 请改成你自己的 Vercel 地址
        const API_URL = 'https://packing-api-chi.vercel.app/api/calculate';

        let scene, camera, renderer, controls;
        let truckGroup, boxesGroup;
        let boxMeshes = [];
        let isAnimating = false;

        const colorPalette = [
            0xe63946, 0xf4a261, 0x2a9d8f, 0x264653,
            0xa8dadc, 0x457b9d, 0xffb703, 0xfb8500,
            0x8338ec, 0x3a86ff, 0xff006e, 0xfb5607
        ];

        function getTruckDims() {
            return {
                l: +document.getElementById('truckL').value,
                w: +document.getElementById('truckW').value,
                h: +document.getElementById('truckH').value
            };
        }

        function initThreeJS() {
            const container = document.getElementById('3d-container');
            container.innerHTML = '';
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);

            const aspect = container.clientWidth / container.clientHeight;
            camera = new THREE.PerspectiveCamera(45, aspect, 10, 5000);
            camera.position.set(600, 400, 600);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, 0, 0);
            controls.update();

            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(500, 800, 300);
            scene.add(dirLight);

            const grid = new THREE.GridHelper(800, 40, 0x444466, 0x222244);
            scene.add(grid);

            truckGroup = new THREE.Group();
            scene.add(truckGroup);
            boxesGroup = new THREE.Group();
            scene.add(boxesGroup);

            drawTruckOutline();

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                updateBoxAnimations();
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                if (!camera || !renderer) return;
                const w = container.clientWidth;
                const h = container.clientHeight;
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
            });
        }

        function drawTruckOutline() {
            while (truckGroup.children.length) truckGroup.remove(truckGroup.children[0]);
            const { l, w, h } = getTruckDims();
            const geo = new THREE.BoxGeometry(l, h, w);
            const edges = new THREE.EdgesGeometry(geo);
            const wireframe = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x00ffff }));
            wireframe.position.set(0, h / 2, 0);
            truckGroup.add(wireframe);

            const transMat = new THREE.MeshPhongMaterial({ color: 0x00ffff, transparent: true, opacity: 0.05, side: THREE.DoubleSide });
            const box = new THREE.Mesh(geo, transMat);
            box.position.copy(wireframe.position);
            truckGroup.add(box);

            controls.target.set(0, h / 2, 0);
            controls.update();
        }

        function toThreeCoords(p) {
            const { l: truckL, w: truckW } = getTruckDims();
            const px = p.x + p.l / 2 - truckL / 2;
            const py = p.z + p.h / 2;
            const pz = p.y + p.w / 2 - truckW / 2;
            return { x: px, y: py, z: pz, l: p.l, w: p.w, h: p.h };
        }

        function buildBoxMeshes(placements) {
            while (boxesGroup.children.length) boxesGroup.remove(boxesGroup.children[0]);
            boxMeshes = [];
            const truckH = getTruckDims().h;
            placements.forEach((p) => {
                const { x, y, z, l, w, h } = toThreeCoords(p);
                const geo = new THREE.BoxGeometry(l, h, w);
                const color = colorPalette[(p.typeId - 1) % colorPalette.length];
                const mat = new THREE.MeshPhongMaterial({ color, specular: 0x111111, shininess: 30 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.userData = {
                    targetPos: new THREE.Vector3(x, y, z),
                    startPos: new THREE.Vector3(x, y + truckH + 50, z),
                    animProgress: 0,
                    animSpeed: 0.02 + Math.random() * 0.03
                };
                mesh.position.copy(mesh.userData.startPos);
                mesh.visible = false;
                boxesGroup.add(mesh);
                boxMeshes.push(mesh);
            });
        }

        function updateBoxAnimations() {
            if (!isAnimating) return;
            let allDone = true;
            boxMeshes.forEach(mesh => {
                if (!mesh.visible) return;
                const ud = mesh.userData;
                if (ud.animProgress < 1) {
                    ud.animProgress += ud.animSpeed;
                    if (ud.animProgress >= 1) {
                        ud.animProgress = 1;
                        mesh.position.copy(ud.targetPos);
                    } else {
                        mesh.position.lerpVectors(ud.startPos, ud.targetPos, ud.animProgress);
                    }
                    allDone = false;
                }
            });
            if (allDone) {
                isAnimating = false;
                document.getElementById('btnAnimate').disabled = true;
            }
        }

        function startAnimation() {
            if (!boxMeshes.length) return;
            boxMeshes.forEach(m => {
                m.visible = false;
                m.position.copy(m.userData.startPos);
                m.userData.animProgress = 0;
            });
            isAnimating = true;
            document.getElementById('btnAnimate').disabled = true;
            let i = 0;
            const interval = setInterval(() => {
                if (i >= boxMeshes.length) { clearInterval(interval); return; }
                const mesh = boxMeshes[i];
                mesh.visible = true;
                mesh.userData.animProgress = 0;
                mesh.position.copy(mesh.userData.startPos);
                i++;
            }, 300);
        }

        function reset3DView() {
            const { h } = getTruckDims();
            camera.position.set(600, h / 2 + 300, 600);
            controls.target.set(0, h / 2, 0);
            controls.update();
        }

        window.addEventListener('load', initThreeJS);

        // ---------- 业务逻辑 ----------
        let lastResultText = '';
        let lastPlacements = [];

        function addBoxRow() {
            const list = document.getElementById('boxList');
            const idx = list.children.length + 1;
            const div = document.createElement('div');
            div.className = 'box-row';
            div.innerHTML = `
                <span>📦 ${idx}</span>
                <input type="number" placeholder="长cm" class="boxL" value="40">
                <input type="number" placeholder="宽cm" class="boxW" value="30">
                <input type="number" placeholder="高cm" class="boxH" value="20">
                <input type="number" placeholder="数量" class="boxQty" value="30" min="1">
            `;
            list.appendChild(div);
        }

        async function calculate() {
            const truckL = +document.getElementById('truckL').value;
            const truckW = +document.getElementById('truckW').value;
            const truckH = +document.getElementById('truckH').value;
            const mode = document.getElementById('mode').value;

            const boxRows = document.querySelectorAll('#boxList .box-row');
            const boxes = [];
            boxRows.forEach((row, index) => {
                const l = +row.querySelector('.boxL').value;
                const w = +row.querySelector('.boxW').value;
                const h = +row.querySelector('.boxH').value;
                const qty = +row.querySelector('.boxQty').value;
                if (l > 0 && w > 0 && h > 0 && qty > 0) {
                    boxes.push({ id: index + 1, l, w, h, qty });
                }
            });

            if (boxes.length === 0) {
                document.getElementById('result').textContent = '❌ 请至少添加一种纸箱。';
                return;
            }

            document.getElementById('result').textContent = '⏳ 正在通过服务器计算，请稍候……';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ truck: { l: truckL, w: truckW, h: truckH }, boxes, mode })
                });
                if (!response.ok) throw new Error('服务器错误 ' + response.status);
                const data = await response.json();
                lastResultText = data.description;
                lastPlacements = data.placements || [];
                document.getElementById('result').textContent = data.description;

                buildBoxMeshes(lastPlacements);
                document.getElementById('btnAnimate').disabled = false;
            } catch (err) {
                document.getElementById('result').textContent = '❌ 计算失败：' + err.message;
                console.error(err);
            }
        }

        function askDeepSeek() {
            if (!lastResultText) return alert('请先计算方案');
            const q = `我使用了一个装箱计算器，得到了以下摆放结果。\n请帮我分析这个方案是否合理，有没有优化空间。\n\n【计算结果】\n${lastResultText}`;
            navigator.clipboard.writeText(q).then(() => {
                alert('✅ 已复制提问内容，即将打开 DeepSeek，请粘贴发送。');
            }).catch(() => alert('复制失败，请手动复制。'));
            window.open('https://chat.deepseek.com/', '_blank');
        }
    </script>
</body>
</html>

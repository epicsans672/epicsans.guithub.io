<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能装箱计算器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; }
    .container { display: flex; height: 100vh; }
    .panel { width: 380px; background: #16213e; padding: 20px; overflow-y: auto; }
    .panel h2 { margin-bottom: 15px; color: #e94560; }
    label { display: block; margin: 10px 0 4px; font-size: 14px; }
    input, button, select { width: 100%; padding: 8px; border: none; border-radius: 6px; margin-bottom: 8px; }
    input, select { background: #0f3460; color: #fff; }
    button { background: #e94560; color: white; font-weight: bold; cursor: pointer; }
    button:hover { background: #ff6b81; }
    .box-row { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
    .box-row input { width: 70px; }
    .box-row button { width: auto; padding: 6px 10px; font-size: 12px; }
    #addBoxBtn { margin-top: 10px; }
    .result { margin-top: 15px; white-space: pre-wrap; font-size: 13px; max-height: 300px; overflow-y: auto; }
    #viewer { flex: 1; position: relative; }
    canvas { display: block; }
  </style>
</head>
<body>
<div class="container">
  <div class="panel">
    <h2>📦 装箱参数</h2>
    <label>卡车内部 宽 (左右方向) cm</label>
    <input id="tw" type="number" value="240">
    <label>卡车内部 深 (前后方向) cm</label>
    <input id="td" type="number" value="590">
    <label>卡车内部 高 (上下方向) cm</label>
    <input id="th" type="number" value="240">

    <h3>纸箱类型</h3>
    <div id="boxList"></div>
    <button id="addBoxBtn">➕ 添加纸箱</button>

    <div style="margin-top:15px;">
      <label>装箱模式</label>
      <select id="mode">
        <option value="auto" selected>优先相邻分布（装不下自动切换）</option>
        <option value="adjacent">仅相邻分布（装不下报错）</option>
        <option value="space">仅占空间最小</option>
      </select>
    </div>
    <button id="calcBtn">🚛 开始计算装箱</button>
    <div id="resultText" class="result"></div>
  </div>
  <div id="viewer"></div>
</div>

<!-- 使用 import map 加载 Three.js -->
<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- 工具函数 ----------
function permuteDims(w, d, h) {
  const arr = [w, d, h];
  const res = new Set();
  for (let i = 0; i < 3; i++)
    for (let j = 0; j < 3; j++) {
      if (j === i) continue;
      let k = 3 - i - j;
      res.add(`${arr[i]},${arr[j]},${arr[k]}`);
    }
  return Array.from(res).map(s => s.split(',').map(Number));
}

// 剩余空间管理（简单切割）
class SpaceManager {
  constructor(tw, td, th) {
    this.spaces = [{ x:0, y:0, z:0, w:tw, d:td, h:th }];
  }
  // 尝试放置一个箱子（返回位置，否则 null）
  tryPlace(bw, bd, bh) {
    // 按最低、最里、最左优先
    this.spaces.sort((a,b) => a.y-b.y || a.z-b.z || a.x-b.x);
    for (let i = 0; i < this.spaces.length; i++) {
      const s = this.spaces[i];
      if (bw <= s.w && bd <= s.d && bh <= s.h) {
        const pos = { x: s.x, y: s.y, z: s.z };
        // 切割剩余空间
        const newSpaces = [];
        if (s.w - bw > 0) newSpaces.push({ x: s.x+bw, y: s.y, z: s.z, w: s.w-bw, d: bd, h: s.h });
        if (s.d - bd > 0) newSpaces.push({ x: s.x, y: s.y, z: s.z+bd, w: s.w, d: s.d-bd, h: s.h });
        if (s.h - bh > 0) newSpaces.push({ x: s.x, y: s.y+bh, z: s.z, w: s.w, d: s.d, h: s.h-bh });
        // 还可加右上、后上等剩余块，这里用简单分割，可能会留碎片，但够用
        this.spaces.splice(i, 1);
        this.spaces.push(...newSpaces);
        return pos;
      }
    }
    return null;
  }
}

// ---------- 装箱算法 ----------
// 返回 { placed: [{ name, x,y,z, w,d,h }], steps: [], success: boolean }
function packAdjacent(tw, td, th, boxes) {
  // 1. 为每种箱子生成一个长方体块
  const blocks = [];
  const steps = [];
  for (let box of boxes) {
    let best = null;
    for (let [bw, bd, bh] of permuteDims(box.w, box.d, box.h)) {
      const maxA = Math.floor(tw / bw);
      const maxB = Math.floor(td / bd);
      const maxC = Math.floor(th / bh);
      if (maxA * maxB * maxC >= box.count) {
        // 寻找最小体积的块
        let minVol = Infinity;
        let bestABC = null;
        for (let a = 1; a <= maxA; a++) {
          for (let b = 1; b <= maxB; b++) {
            const c = Math.ceil(box.count / (a * b));
            if (c <= maxC) {
              const vol = (a*bw) * (b*bd) * (c*bh);
              if (vol < minVol) {
                minVol = vol;
                bestABC = { a, b, c, w: a*bw, d: b*bd, h: c*bh };
              }
            }
          }
        }
        if (bestABC && bestABC.w <= tw && bestABC.d <= td && bestABC.h <= th) {
          if (!best || bestABC.w*bestABC.d*bestABC.h < best.w*best.d*best.h) {
            best = { ...bestABC, name: box.name, count: box.count, bw, bd, bh };
          }
        }
      }
    }
    if (!best) return { success: false, placed: [], steps: [] }; // 无法单块容纳
    blocks.push(best);
    steps.push(`将“${box.name}”${box.count}个排列成 ${best.a}×${best.b}×${best.c} 的块（宽${best.w} 深${best.d} 高${best.h}cm）`);
  }

  // 2. 对块进行装箱（块不旋转）
  const sm = new SpaceManager(tw, td, th);
  const placed = [];
  const blockSteps = [];
  for (let block of blocks) {
    const pos = sm.tryPlace(block.w, block.d, block.h);
    if (!pos) return { success: false, placed: [], steps: [] };
    // 展开块内的箱子
    let countRemaining = block.count;
    for (let k = 0; k < block.c && countRemaining > 0; k++) {
      for (let j = 0; j < block.b && countRemaining > 0; j++) {
        for (let i = 0; i < block.a && countRemaining > 0; i++) {
          const cx = pos.x + i * block.bw;
          const cy = pos.y + k * block.bh;
          const cz = pos.z + j * block.bd;
          placed.push({
            name: block.name,
            x: cx, y: cy, z: cz,
            w: block.bw, d: block.bd, h: block.bh
          });
          countRemaining--;
        }
      }
    }
    const dirDesc = `放置在 左后下角 (${pos.x},${pos.y},${pos.z})`;
    blockSteps.push(dirDesc);
  }
  const fullSteps = [...steps, ...blockSteps];
  return { success: true, placed, steps: fullSteps };
}

function packSpaceMin(tw, td, th, boxes) {
  const sm = new SpaceManager(tw, td, th);
  const placed = [];
  const items = [];
  // 将所有箱子展开，每个带所有方向
  for (let box of boxes) {
    for (let i = 0; i < box.count; i++) {
      items.push({ name: box.name, dims: permuteDims(box.w, box.d, box.h) });
    }
  }
  // 按体积降序
  items.sort((a,b) => {
    const vol = arr => arr[0]*arr[1]*arr[2];
    return vol(b.dims[0]) - vol(a.dims[0]);
  });
  const steps = [];
  for (let item of items) {
    let placedOne = false;
    // 尝试所有方向
    for (let [bw, bd, bh] of item.dims) {
      const pos = sm.tryPlace(bw, bd, bh);
      if (pos) {
        placed.push({ name: item.name, x: pos.x, y: pos.y, z: pos.z, w: bw, d: bd, h: bh });
        steps.push(`放置 ${item.name} 于 (${pos.x},${pos.y},${pos.z}) 尺寸 ${bw}×${bd}×${bh}`);
        placedOne = true;
        break;
      }
    }
    if (!placedOne) return { success: false, placed, steps };
  }
  return { success: true, placed, steps };
}

// ---------- 渲染 & 交互 ----------
let scene, camera, renderer, controls;
function init3D() {
  const container = document.getElementById('viewer');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a2e);
  camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 10, 3000);
  camera.position.set(600, 500, 800);
  camera.lookAt(100, 100, 200);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(120, 120, 250);
  controls.update();

  // 灯光
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(300, 500, 400);
  scene.add(dirLight);

  // 坐标轴辅助
  scene.add(new THREE.AxesHelper(300));
  window.addEventListener('resize', () => {
    const w = container.clientWidth;
    const h = container.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
}

function drawTruck(tw, td, th) {
  const geo = new THREE.BoxGeometry(tw, th, td);
  const mat = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
  const truck = new THREE.Mesh(geo, mat);
  truck.position.set(tw/2, th/2, td/2);
  scene.add(truck);
}

function drawBoxes(placed) {
  const colors = ['#e94560', '#f5a623', '#43d8c9', '#6c5ce7', '#74b9ff'];
  let colorIdx = 0;
  const nameColorMap = {};
  for (let item of placed) {
    if (!nameColorMap[item.name]) {
      nameColorMap[item.name] = colors[colorIdx % colors.length];
      colorIdx++;
    }
    const color = nameColorMap[item.name];
    const geo = new THREE.BoxGeometry(item.w, item.h, item.d);
    const mat = new THREE.MeshPhongMaterial({ color, transparent: true, opacity: 0.75 });
    const cube = new THREE.Mesh(geo, mat);
    cube.position.set(item.x + item.w/2, item.y + item.h/2, item.z + item.d/2);
    scene.add(cube);
    // 边框
    const edge = new THREE.LineSegments(
      new THREE.EdgesGeometry(geo),
      new THREE.LineBasicMaterial({ color: 0xffffff })
    );
    cube.add(edge);
  }
}

let placedResult = [];
function clearScene() {
  while(scene.children.length > 0) scene.remove(scene.children[0]);
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dl = new THREE.DirectionalLight(0xffffff, 0.8);
  dl.position.set(300, 500, 400);
  scene.add(dl);
  scene.add(new THREE.AxesHelper(300));
}

// ---------- UI 逻辑 ----------
function addBoxRow() {
  const div = document.createElement('div');
  div.className = 'box-row';
  div.innerHTML = `
    <input class="boxName" placeholder="名称" value="纸箱A">
    <input class="boxW" type="number" placeholder="宽" value="50">
    <input class="boxD" type="number" placeholder="深" value="40">
    <input class="boxH" type="number" placeholder="高" value="30">
    <input class="boxCount" type="number" placeholder="数量" value="10">
    <button class="delBox">✕</button>
  `;
  div.querySelector('.delBox').onclick = () => div.remove();
  document.getElementById('boxList').appendChild(div);
}

function getBoxes() {
  const rows = document.querySelectorAll('#boxList .box-row');
  return Array.from(rows).map(row => ({
    name: row.querySelector('.boxName').value,
    w: +row.querySelector('.boxW').value,
    d: +row.querySelector('.boxD').value,
    h: +row.querySelector('.boxH').value,
    count: +row.querySelector('.boxCount').value
  })).filter(b => b.w>0 && b.d>0 && b.h>0 && b.count>0);
}

async function calculate() {
  const tw = +document.getElementById('tw').value;
  const td = +document.getElementById('td').value;
  const th = +document.getElementById('th').value;
  const boxes = getBoxes();
  if (!tw||!td||!th||!boxes.length) return alert('请完整填写尺寸和至少一个纸箱');
  const mode = document.getElementById('mode').value;

  let result;
  // 优先相邻分布
  const adjRes = packAdjacent(tw, td, th, boxes);
  if (mode === 'adjacent') {
    result = adjRes;
  } else if (mode === 'space') {
    result = packSpaceMin(tw, td, th, boxes);
  } else { // auto
    if (adjRes.success) {
      result = adjRes;
      document.getElementById('resultText').textContent = '✅ 已采用“相邻分布”方案：\n' + adjRes.steps.join('\n');
    } else {
      result = packSpaceMin(tw, td, th, boxes);
      if (result.success) {
        document.getElementById('resultText').textContent = '⚠️ 无法保证所有相同箱子相邻，已切换为“占空间最小”方案：\n' + result.steps.join('\n');
      } else {
        document.getElementById('resultText').textContent = '❌ 无法装入所有箱子，请检查尺寸。';
        return;
      }
    }
  }

  if (!result.success) {
    document.getElementById('resultText').textContent = '❌ 装不下所有箱子。';
    return;
  }

  // 显示通俗语言描述（自动生成）
  const desc = result.steps.length ? result.steps.join('\n') : '已全部放置';
  document.getElementById('resultText').textContent = desc;

  // 渲染3D
  clearScene();
  drawTruck(tw, td, th);
  drawBoxes(result.placed);
  placedResult = result.placed;
}

// 初始化
document.getElementById('addBoxBtn').onclick = addBoxRow;
document.getElementById('calcBtn').onclick = calculate;
addBoxRow(); // 默认加一个
init3D();
// 初始绘制空车厢
drawTruck(240, 590, 240);

// 动画循环
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
